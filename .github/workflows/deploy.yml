name: Deploy to GitHub Pages

on:
  # ⚠️ **刻意沒有 push 觸發**（2026-08-06 站長裁示）。
  #
  # 原本每次 push 都部署，而各產線是「一篇文章一個 commit 一次 push」，加上人工推送，
  # 一天疊到 200 次部署。2026-08-06 08:46 之後連續六次 `build: success / deploy: failure`，
  # deploy 步驟 600 秒內狀態始終是 `deployment_queued`——GitHub 根本沒開始處理我們的
  # artifact（站台僅 392 MB，是 1 GB 上限的三分之一，不是體積問題），研判是部署頻率被節流。
  #
  # 改成「排程收斂」：每 15 分鐘一次＝最多 4 次/小時，替 workflow_dispatch 留餘裕
  # （健康紀念日準點上線、臨時發佈都用它）。代價是 push 後最多等 15 分鐘才上線，
  # 而 GitHub 排程 workflow 常誤點，實際可能 20–30 分鐘。**急著上線就手動戳**：
  #   gh workflow run deploy.yml
  workflow_dispatch:
  # 排程重建：把這段時間內 push 的內容一次帶上線，也讓「未來日期」的排程稿到時間後自動上線
  # （靜態站需重新 build 才會產生新文章）。
  schedule:
    - cron: '*/15 * * * *'

# 提前切到 Node.js 24 執行 JS actions（如 actions/deploy-pages@v4），
# 消除「Node.js 20 actions are deprecated」警告。官方 opt-in 旗標。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# 允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 排程每 15 分鐘跑一次，但**沒有變動就不要 build/deploy**：
  # 無條件跑等於一天 96 次、每次重傳約 335 MB，而平常日真正有內容的只有十幾次。
  # 判斷不能只看 commit——排程稿是靠「build 當下時間」才轉正的，沒有新 commit 也可能該重建。
  # 詳見 scripts/deploy-needed.mjs。手動 workflow_dispatch 一律直接部署，不做這個檢查。
  check:
    runs-on: ubuntu-latest
    outputs:
      should: ${{ steps.decide.outputs.should }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 判斷是否需要部署
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動觸發，直接部署"; echo "should=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 找最近一次「成功」的 github-pages 部署，取它的 sha 與時間
          last=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30" --jq '.[].id'); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state // empty')
            if [ "$st" = "success" ]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha + " " + .created_at')
              break
            fi
          done
          if [ -z "$last" ]; then
            echo "找不到上次成功部署 → 照部署（fail-open）"; echo "should=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          need=$(node scripts/deploy-needed.mjs $last)
          echo "上次成功部署：$last｜需要部署：$need"
          echo "should=$need" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ── 上線 gate：內部壞連結即讓部署失敗、退回，不上線 ──
      # 比照 evidencetoday 的「Check internal links（fail: true）」，
      # 改用 base-path（/appi.news）感知的檢查（lychee 預設不認 base）。
      - name: Check internal links (hard gate)
        run: pnpm check:links

      # 自訂網域 appi.news 後 base 為根（/），dist 資產為根路徑；暫存到 _site 根目錄，
      # Lighthouse 以 http://localhost/ 稽核（lighthouserc.json 的 url 同步改根）。
      - name: Stage site for Lighthouse
        run: |
          mkdir -p _site
          cp -r dist/. _site/

      # 軟性稽核（不擋部署）：加 timeout-minutes 護欄，避免 Lighthouse 卡死無限期擋住
      # 後面的 Upload artifact 與部署（continue-on-error 只處理「失敗」，不處理「hang」）。
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # staticDistDir 改放 lighthouserc.json 的 ci.collect（此 action 不接受該 input）
          configPath: ./lighthouserc.json
          uploadArtifacts: true
        continue-on-error: true
        timeout-minutes: 5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署完成、線上可取得後，才向 IndexNow 推送近期上線/更新的網址，
      # 讓 Bing（含 ChatGPT Search / Copilot）等引擎即時重爬。best-effort，不擋部署。
      - name: Checkout (for IndexNow)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true

  # 設計規範守門/建置失敗時通知 Slack（secrets 未設則靜默跳過）
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # 取 checkout 只為了讀 report-config.mjs 的 DEV_CHANNEL——頻道 ID 的單一真實來源在那裡，
      # 不抄進 workflow、也不再依賴 SLACK_CHANNEL_ID secret（2026-08-08：CI 告警與站上所有
      # ❌/⚠️ 一樣收在 dev 台）。secret 仍留作退路，讀不到檔案時用它。
      - uses: actions/checkout@v4
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_FALLBACK: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          SLACK_CHANNEL_ID="$(sed -n "s/^export const DEV_CHANNEL = '\([^']*\)'.*/\1/p" scripts/lib/report-config.mjs | head -1)"
          [ -z "$SLACK_CHANNEL_ID" ] && SLACK_CHANNEL_ID="$SLACK_CHANNEL_FALLBACK"
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack token 或頻道取不到；skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="❌ ${{ github.repository }} 部署被守門擋下（commit ${GITHUB_SHA::7}）。請修正設計規範/建置錯誤後 push，workflow 會自動重審。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
