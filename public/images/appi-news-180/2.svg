<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="瘦瘦針使用前六項必做抽血評估：空腹血糖與HbA1c、肝功能ALT/AST、腎功能eGFR、甲狀腺TSH、血脂四項、澱粉酶與脂肪酶，各項列出評估目的與注意閾值">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.head{font-size:14px;font-weight:700;fill:#6e7276;letter-spacing:.5px;}
.item{font-size:19px;font-weight:700;fill:#1e2030;}
.code{font-size:13px;fill:#6e7276;}
.purpose{font-size:15px;fill:#6e7276;}
.thresh{font-size:14px;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">瘦瘦針使用前六項必做抽血評估</text>
<text x="58" y="90" class="deck">開藥前抽血確認肝腎、血糖、甲狀腺與胰臟狀態，最終用藥決策以醫師判斷為準</text>

<!-- 表頭 -->
<text x="40" y="128" class="head">檢查項目</text>
<text x="360" y="128" class="head">評估目的</text>
<text x="710" y="128" class="head">注意閾值</text>
<line x1="40" y1="140" x2="920" y2="140" stroke="#1e2030" stroke-width="1.5"/>

<!-- 欄位分隔線 -->
<line x1="345" y1="140" x2="345" y2="500" stroke="#e8e9ed" stroke-width="1"/>
<line x1="695" y1="140" x2="695" y2="500" stroke="#e8e9ed" stroke-width="1"/>

<!-- 焦點列：腎功能（eGFR < 15 為絕對禁忌） -->
<rect x="40" y="281" width="880" height="59" rx="8" fill="#eaf0f8"/>
<rect x="40" y="281" width="880" height="3" rx="1.5" fill="#a87515"/>

<!-- 列 1：空腹血糖 / HbA1c -->
<text x="40" y="182" class="item">空腹血糖 ／ HbA1c</text>
<text x="40" y="204" class="code">FBS、HbA1c　糖化血色素</text>
<text x="360" y="194" class="purpose">判斷血糖狀態、是否有糖尿病</text>
<text x="710" y="194" class="thresh">HbA1c ≥ 6.5% 屬糖尿病範圍</text>
<line x1="40" y1="220" x2="920" y2="220" stroke="#e8e9ed" stroke-width="1"/>

<!-- 列 2：肝功能 ALT / AST -->
<text x="40" y="242" class="item">肝功能 ALT ／ AST</text>
<text x="40" y="264" class="code">ALT、AST　肝臟功能指數</text>
<text x="360" y="254" class="purpose">確認肝臟基礎狀態</text>
<text x="710" y="254" class="thresh">明顯異常需先評估原因</text>
<line x1="40" y1="280" x2="920" y2="280" stroke="#e8e9ed" stroke-width="1"/>

<!-- 列 3：腎功能 eGFR（焦點） -->
<text x="40" y="302" class="item">腎功能 eGFR</text>
<text x="40" y="324" class="code">eGFR、Cr　腎絲球過濾率</text>
<text x="360" y="314" class="purpose">確認腎臟濾過功能</text>
<text x="710" y="314" class="thresh">eGFR &lt; 15 列為絕對禁忌</text>
<line x1="40" y1="340" x2="920" y2="340" stroke="#e8e9ed" stroke-width="1"/>

<!-- 列 4：甲狀腺 TSH -->
<text x="40" y="362" class="item">甲狀腺 TSH</text>
<text x="40" y="384" class="code">TSH　促甲狀腺素</text>
<text x="360" y="374" class="purpose">排除甲狀腺疾病風險</text>
<text x="710" y="374" class="thresh">有髓質癌家族史者從嚴</text>
<line x1="40" y1="400" x2="920" y2="400" stroke="#e8e9ed" stroke-width="1"/>

<!-- 列 5：血脂四項 -->
<text x="40" y="422" class="item">血脂四項</text>
<text x="40" y="444" class="code">TC、LDL、HDL、TG</text>
<text x="360" y="434" class="purpose">評估代謝整體狀況</text>
<text x="710" y="434" class="thresh">作為治療前後對照基準</text>
<line x1="40" y1="460" x2="920" y2="460" stroke="#e8e9ed" stroke-width="1"/>

<!-- 列 6：澱粉酶 / 脂肪酶 -->
<text x="40" y="482" class="item">澱粉酶 ／ 脂肪酶</text>
<text x="40" y="504" class="code">Amylase、Lipase　胰臟酵素</text>
<text x="360" y="494" class="purpose">排除潛在胰臟發炎</text>
<text x="710" y="494" class="thresh">胰臟炎病史者必查</text>

<!-- 頁尾 -->
<line x1="40" y1="546" x2="920" y2="546" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="574" class="foot">製圖：APPI News</text>
<text x="920" y="574" text-anchor="end" class="foot">資料：文內抽血評估核心項目・實際項目依醫師評估</text>
</svg>
