<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="楊桃營養與功效三面向並列：關鍵抗氧化成分（維生素C、表兒茶素、沒食子酸）、傳統中醫特性（涼性、清熱止渴、利尿潤肺）、現代研究發現（抗氧化、降血糖潛力、抗發炎）">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.col{font-size:20px;font-weight:700;fill:#1e2030;}
.item{font-size:17px;font-weight:700;fill:#1e2030;}
.desc{font-size:14px;fill:#6e7276;}
.note{font-size:13px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">楊桃：營養成分與傳統功效</text>
<text x="58" y="90" class="deck">清熱解渴的水果，多酚抗氧化成分獲現代研究部分佐證</text>

<!-- 焦點欄（營養成分）底色 -->
<rect x="40" y="126" width="286" height="356" rx="12" fill="#eaf0f8"/>
<rect x="52" y="126" width="262" height="3" rx="1.5" fill="#a87515"/>

<!-- 欄位分隔線 -->
<line x1="340" y1="150" x2="340" y2="470" stroke="#e8e9ed" stroke-width="1"/>
<line x1="630" y1="150" x2="630" y2="470" stroke="#e8e9ed" stroke-width="1"/>

<!-- 欄一：關鍵抗氧化成分（焦點） -->
<text x="64" y="162" class="col">關鍵抗氧化成分</text>
<circle cx="68" cy="205" r="4" fill="#a87515"/>
<text x="84" y="210" class="item">維生素 C</text>
<text x="84" y="230" class="desc">高含量，支持免疫與膠原合成</text>
<circle cx="68" cy="263" r="4" fill="#a87515"/>
<text x="84" y="268" class="item">表兒茶素（Epicatechin）</text>
<text x="84" y="288" class="desc">多酚類植物抗氧化物</text>
<circle cx="68" cy="321" r="4" fill="#a87515"/>
<text x="84" y="326" class="item">沒食子酸（Gallic Acid）</text>
<text x="84" y="346" class="desc">植物多酚，天然抗氧化成分</text>
<circle cx="68" cy="406" r="4" fill="#5e6070"/>
<text x="84" y="411" class="note">低熱量・高水分</text>
<text x="84" y="433" class="note">每 100g 約 31 大卡</text>

<!-- 欄二：傳統中醫特性 -->
<text x="360" y="162" class="col">傳統中醫特性</text>
<circle cx="364" cy="205" r="4" fill="#a87515"/>
<text x="380" y="210" class="item">涼性</text>
<text x="380" y="230" class="desc">性味甘酸微涼，入肺、胃經</text>
<circle cx="364" cy="263" r="4" fill="#a87515"/>
<text x="380" y="268" class="item">清熱止渴</text>
<text x="380" y="288" class="desc">傳統用於夏季消暑解渴</text>
<circle cx="364" cy="321" r="4" fill="#a87515"/>
<text x="380" y="326" class="item">利尿潤肺</text>
<text x="380" y="346" class="desc">傳統認為助排水、潤肺燥</text>
<circle cx="364" cy="406" r="4" fill="#5e6070"/>
<text x="380" y="411" class="note">以上為傳統文獻記載</text>
<text x="380" y="433" class="note">非現代醫學診斷依據</text>

<!-- 欄三：現代研究發現 -->
<text x="656" y="162" class="col">現代研究發現</text>
<circle cx="660" cy="205" r="4" fill="#a87515"/>
<text x="676" y="210" class="item">抗氧化活性</text>
<text x="676" y="230" class="desc">多酚具自由基清除效果</text>
<circle cx="660" cy="263" r="4" fill="#a87515"/>
<text x="676" y="268" class="item">降血糖潛力</text>
<text x="676" y="288" class="desc">動物實驗觀察，人體待驗</text>
<circle cx="660" cy="321" r="4" fill="#a87515"/>
<text x="676" y="326" class="item">抗發炎作用</text>
<text x="676" y="346" class="desc">動物模型中觀察到結果</text>
<path d="M660 397 L668 411 L652 411 Z" fill="#a12a2a"/>
<text x="662" y="408.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">!</text>
<text x="676" y="411" class="note">腎功能不佳者應慎食（含草酸）</text>
<text x="676" y="433" class="note">宜適量攝取</text>

<!-- 衛教聲明 -->
<text x="480" y="506" text-anchor="middle" class="note">本圖僅供衛教參考，不作為醫療診斷或治療建議</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="552" class="foot">製圖：APPI News</text>
<text x="920" y="552" text-anchor="end" class="foot">資料來源：營養成分分析與本草文獻整理</text>
</svg>
