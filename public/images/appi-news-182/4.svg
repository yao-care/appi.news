<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<defs><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif}</style></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect width="960" height="72" fill="#1B5E4B"/>
<text x="480" y="33" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">楊桃安全風險評估</text>
<text x="480" y="57" text-anchor="middle" font-size="13" fill="#C9A227">以下族群與行為，攝取楊桃前請先諮詢醫師意見</text>
<rect x="24" y="82" width="444" height="496" rx="10" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
<rect x="24" y="82" width="444" height="48" rx="10" fill="#1B5E4B"/>
<rect x="24" y="106" width="444" height="24" fill="#1B5E4B"/>
<text x="246" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">高風險族群</text>
<rect x="492" y="82" width="444" height="496" rx="10" fill="#F2F7F5" stroke="#C9A227" stroke-width="2"/>
<rect x="492" y="82" width="444" height="48" rx="10" fill="#C9A227"/>
<rect x="492" y="106" width="444" height="24" fill="#C9A227"/>
<text x="714" y="113" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">高風險行為</text>
<circle cx="66" cy="175" r="22" fill="#2E8B6F"/>
<text x="66" y="181" text-anchor="middle" font-size="15" fill="#FFFFFF">腎</text>
<text x="102" y="168" font-size="14" font-weight="bold" fill="#1F2A28">慢性腎臟病（CKD）</text>
<text x="102" y="186" font-size="12" fill="#6B7B77">腎功能受損，楊桃毒素難以排出體外</text>
<line x1="46" y1="220" x2="450" y2="220" stroke="#1B5E4B" stroke-width="0.8" opacity="0.3"/>
<circle cx="66" cy="265" r="22" fill="#2E8B6F"/>
<text x="66" y="271" text-anchor="middle" font-size="15" fill="#FFFFFF">糖</text>
<text x="102" y="258" font-size="14" font-weight="bold" fill="#1F2A28">糖尿病腎病變</text>
<text x="102" y="276" font-size="12" fill="#6B7B77">腎病合併症，神經毒素中毒風險更高</text>
<line x1="46" y1="310" x2="450" y2="310" stroke="#1B5E4B" stroke-width="0.8" opacity="0.3"/>
<circle cx="66" cy="355" r="22" fill="#2E8B6F"/>
<text x="66" y="361" text-anchor="middle" font-size="15" fill="#FFFFFF">老</text>
<text x="102" y="348" font-size="14" font-weight="bold" fill="#1F2A28">老年人</text>
<text x="102" y="366" font-size="12" fill="#6B7B77">腎功能隨年齡自然衰退，代謝能力下降</text>
<line x1="46" y1="400" x2="450" y2="400" stroke="#1B5E4B" stroke-width="0.8" opacity="0.3"/>
<circle cx="66" cy="445" r="22" fill="#2E8B6F"/>
<text x="66" y="451" text-anchor="middle" font-size="15" fill="#FFFFFF">藥</text>
<text x="102" y="438" font-size="14" font-weight="bold" fill="#1F2A28">服用利尿劑者</text>
<text x="102" y="456" font-size="12" fill="#6B7B77">利尿劑影響腎臟排毒功能，增加風險</text>
<line x1="46" y1="490" x2="450" y2="490" stroke="#1B5E4B" stroke-width="0.8" opacity="0.3"/>
<circle cx="66" cy="535" r="22" fill="#2E8B6F"/>
<text x="66" y="541" text-anchor="middle" font-size="15" fill="#FFFFFF">水</text>
<text x="102" y="528" font-size="14" font-weight="bold" fill="#1F2A28">脫水狀態者</text>
<text x="102" y="546" font-size="12" fill="#6B7B77">脫水使血中毒素濃度相對升高</text>
<circle cx="534" cy="205" r="22" fill="#C9A227"/>
<text x="534" y="211" text-anchor="middle" font-size="15" fill="#FFFFFF">空</text>
<circle cx="550" cy="221" r="8" fill="#C0392B"/>
<text x="550" y="225" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">!</text>
<text x="570" y="198" font-size="14" font-weight="bold" fill="#1F2A28">空腹食用楊桃</text>
<text x="570" y="216" font-size="12" fill="#6B7B77">空腹時毒素吸收速度明顯加快</text>
<line x1="512" y1="280" x2="918" y2="280" stroke="#C9A227" stroke-width="0.8" opacity="0.3"/>
<circle cx="534" cy="354" r="22" fill="#C9A227"/>
<text x="534" y="360" text-anchor="middle" font-size="15" fill="#FFFFFF">汁</text>
<circle cx="550" cy="370" r="8" fill="#C0392B"/>
<text x="550" y="374" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">!</text>
<text x="570" y="347" font-size="14" font-weight="bold" fill="#1F2A28">飲用濃縮楊桃汁</text>
<text x="570" y="365" font-size="12" fill="#6B7B77">濃縮汁中毒素含量遠高於新鮮果肉</text>
<line x1="512" y1="429" x2="918" y2="429" stroke="#C9A227" stroke-width="0.8" opacity="0.3"/>
<circle cx="534" cy="503" r="22" fill="#C9A227"/>
<text x="534" y="509" text-anchor="middle" font-size="15" fill="#FFFFFF">量</text>
<circle cx="550" cy="519" r="8" fill="#C0392B"/>
<text x="550" y="523" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">!</text>
<text x="570" y="496" font-size="14" font-weight="bold" fill="#1F2A28">一次大量食用</text>
<text x="570" y="514" font-size="12" fill="#6B7B77">短時間攝入過多，腎臟負荷超標</text>
<rect y="580" width="960" height="20" fill="#F2F7F5"/>
<text x="480" y="594" text-anchor="middle" font-size="11" fill="#6B7B77">本圖表僅供衛教參考，不取代醫師診斷。如有健康疑慮，請諮詢專業醫療人員。</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>