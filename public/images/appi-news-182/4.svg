<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="楊桃安全風險評估：高風險族群（慢性腎臟病、糖尿病腎病變、老年人、服用利尿劑者、脫水狀態者）與高風險行為（空腹食用、飲用濃縮汁、一次大量食用）">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.col{font-size:20px;font-weight:700;fill:#1e2030;}
.item{font-size:17px;font-weight:700;fill:#1e2030;}
.desc{font-size:14px;fill:#6e7276;}
.note{font-size:13px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">楊桃安全風險評估</text>
<text x="58" y="90" class="deck">楊桃含神經毒素，以下族群與吃法風險較高，食用前請先諮詢醫師</text>

<!-- 欄位分隔線 -->
<line x1="480" y1="150" x2="480" y2="520" stroke="#e8e9ed" stroke-width="1"/>

<!-- 欄A：高風險族群 -->
<path d="M64 141 L74 159 L54 159 Z" fill="#a12a2a"/>
<text x="66.5" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="160" class="col">高風險族群</text>

<path d="M64 197 L72 211 L56 211 Z" fill="#a12a2a"/>
<text x="66" y="208.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="211" class="item">慢性腎臟病（CKD）</text>
<text x="92" y="231" class="desc">腎功能受損，楊桃毒素難以排出體外</text>

<path d="M64 259 L72 273 L56 273 Z" fill="#a12a2a"/>
<text x="66" y="270.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="273" class="item">糖尿病腎病變</text>
<text x="92" y="293" class="desc">腎病合併症，神經毒素中毒風險更高</text>

<path d="M64 321 L72 335 L56 335 Z" fill="#a12a2a"/>
<text x="66" y="332.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="335" class="item">老年人</text>
<text x="92" y="355" class="desc">腎功能隨年齡自然衰退，代謝能力下降</text>

<path d="M64 383 L72 397 L56 397 Z" fill="#a12a2a"/>
<text x="66" y="394.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="397" class="item">服用利尿劑者</text>
<text x="92" y="417" class="desc">利尿劑影響腎臟排毒功能，增加風險</text>

<path d="M64 445 L72 459 L56 459 Z" fill="#a12a2a"/>
<text x="66" y="456.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="92" y="459" class="item">脫水狀態者</text>
<text x="92" y="479" class="desc">脫水使血中毒素濃度相對升高</text>

<!-- 欄B：高風險行為 -->
<path d="M514 141 L524 159 L504 159 Z" fill="#a12a2a"/>
<text x="516.5" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">!</text>
<text x="542" y="160" class="col">高風險行為</text>

<path d="M514 221 L522 235 L506 235 Z" fill="#a12a2a"/>
<text x="516" y="232.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="542" y="235" class="item">空腹食用楊桃</text>
<text x="542" y="255" class="desc">空腹時毒素吸收速度明顯加快</text>

<path d="M514 316 L522 330 L506 330 Z" fill="#a12a2a"/>
<text x="516" y="327.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="542" y="330" class="item">飲用濃縮楊桃汁</text>
<text x="542" y="350" class="desc">濃縮汁毒素含量遠高於新鮮果肉</text>

<path d="M514 411 L522 425 L506 425 Z" fill="#a12a2a"/>
<text x="516" y="422.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="542" y="425" class="item">一次大量食用</text>
<text x="542" y="445" class="desc">短時間攝入過多，腎臟負荷超標</text>

<!-- 衛教聲明 -->
<text x="480" y="506" text-anchor="middle" class="note">本圖僅供衛教參考，不取代醫師診斷；如有健康疑慮請諮詢專業醫療人員</text>

<!-- 頁尾 -->
<line x1="40" y1="528" x2="920" y2="528" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="554" class="foot">製圖：APPI News</text>
<text x="920" y="554" text-anchor="end" class="foot">資料來源：楊桃與腎功能安全衛教整理</text>
</svg>
