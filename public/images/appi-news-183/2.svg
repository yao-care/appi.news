<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="納豆激酶抑制 ACE 路徑對照圖：正常路徑下血管收縮素 I 經 ACE 轉化為血管收縮素 II 導致血管收縮、血壓升高；納豆激酶介入後抑制 ACE、血管收縮素 II 生成量下降、血管舒張、血壓趨於正常">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.head{font-size:18px;font-weight:700;fill:#1e2030;}
.node{font-size:15px;font-weight:700;fill:#1e2030;}
.en{font-size:12px;fill:#6e7276;}
.tag{font-size:12px;font-weight:700;fill:#a87515;}
.pill{font-size:13px;font-weight:700;fill:#ffffff;}
.foot{font-size:13px;fill:#6e7276;}
.note{font-size:13px;fill:#6e7276;}
</style>
<defs>
<marker id="arG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#6e7276" stroke-width="1.4"/></marker>
<marker id="arGold" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#a87515" stroke-width="1.6"/></marker>
</defs>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">納豆激酶如何影響血壓：RAS 路徑對照</text>
<text x="58" y="90" class="deck">阻斷 ACE 轉化酶、減少血管收縮素 II 生成，血壓隨之趨緩</text>

<!-- 路徑標頭 -->
<circle cx="150" cy="128" r="6" fill="#5e6070"/>
<text x="166" y="133" class="head">正常路徑（未介入）</text>
<circle cx="602" cy="128" r="6" fill="#a87515"/>
<text x="618" y="133" class="head">納豆激酶介入後</text>

<!-- 左路徑：血管收縮素 I -->
<rect x="130" y="150" width="240" height="56" rx="12" fill="#eef0f3"/>
<text x="250" y="176" text-anchor="middle" class="node">血管收縮素 I</text>
<text x="250" y="194" text-anchor="middle" class="en">Angiotensin I</text>
<line x1="250" y1="206" x2="250" y2="236" stroke="#6e7276" stroke-width="2" marker-end="url(#arG)"/>
<text x="262" y="227" class="tag">ACE 作用</text>

<rect x="130" y="238" width="240" height="56" rx="12" fill="#eef0f3"/>
<text x="250" y="264" text-anchor="middle" class="node">ACE 轉化酶</text>
<text x="250" y="282" text-anchor="middle" class="en">生成血管收縮素 II</text>
<line x1="250" y1="294" x2="250" y2="324" stroke="#6e7276" stroke-width="2" marker-end="url(#arG)"/>

<rect x="130" y="326" width="240" height="56" rx="12" fill="#eef0f3"/>
<text x="250" y="352" text-anchor="middle" class="node">血管收縮</text>
<text x="250" y="370" text-anchor="middle" class="en">Vasoconstriction</text>
<line x1="250" y1="382" x2="250" y2="412" stroke="#6e7276" stroke-width="2" marker-end="url(#arG)"/>

<rect x="130" y="414" width="240" height="56" rx="12" fill="#eef0f3"/>
<circle cx="160" cy="442" r="13" fill="#5e6070"/>
<path d="M154 445 L160 437 L166 445" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="184" y="440" class="node">血壓升高</text>
<text x="184" y="459" class="en">High Blood Pressure</text>

<!-- 右路徑：血管收縮素 I -->
<rect x="590" y="150" width="240" height="56" rx="12" fill="#eef0f3"/>
<text x="710" y="176" text-anchor="middle" class="node">血管收縮素 I</text>
<text x="710" y="194" text-anchor="middle" class="en">Angiotensin I</text>
<line x1="710" y1="206" x2="710" y2="236" stroke="#6e7276" stroke-width="2" marker-end="url(#arG)"/>

<!-- 納豆激酶抑制標示 -->
<rect x="406" y="246" width="152" height="40" rx="20" fill="#1f3a5f"/>
<text x="482" y="271" text-anchor="middle" class="pill">納豆激酶抑制 ACE</text>
<line x1="560" y1="266" x2="585" y2="266" stroke="#a12a2a" stroke-width="2.5"/>
<line x1="586" y1="257" x2="586" y2="275" stroke="#a12a2a" stroke-width="3.5"/>

<rect x="590" y="238" width="240" height="56" rx="12" fill="#eaf0f8"/>
<text x="710" y="264" text-anchor="middle" class="node">ACE 受抑制</text>
<text x="710" y="282" text-anchor="middle" class="en">血管收縮素 II 生成量↓</text>
<line x1="710" y1="294" x2="710" y2="324" stroke="#6e7276" stroke-width="2" marker-end="url(#arG)"/>

<rect x="590" y="326" width="240" height="56" rx="12" fill="#eaf0f8"/>
<text x="710" y="352" text-anchor="middle" class="node">血管舒張</text>
<text x="710" y="370" text-anchor="middle" class="en">Vasodilation</text>
<line x1="710" y1="382" x2="710" y2="412" stroke="#a87515" stroke-width="2" marker-end="url(#arGold)"/>

<rect x="590" y="414" width="240" height="56" rx="12" fill="#eaf0f8"/>
<rect x="590" y="414" width="4" height="56" rx="2" fill="#a87515"/>
<circle cx="620" cy="442" r="13" fill="#a87515"/>
<path d="M614 439 L620 447 L626 439" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="644" y="440" class="node">血壓趨於正常</text>
<text x="644" y="459" class="en">Lower Blood Pressure</text>

<!-- 衛教聲明 -->
<text x="480" y="504" text-anchor="middle" class="note">本圖為衛教機轉示意，不作為醫療診斷或治療建議</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="552" class="foot">製圖：APPI News</text>
<text x="920" y="552" text-anchor="end" class="foot">資料來源：Hypertens Res 2008・Rev Cardiovasc Med 2023</text>
</svg>
