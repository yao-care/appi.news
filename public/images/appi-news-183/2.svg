<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<defs>
  <style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}</style>
  <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1B5E4B"/></marker>
  <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#D32F2F"/></marker>
  <marker id="ag2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2E8B6F"/></marker>
</defs>
<rect width="960" height="600" fill="#fff"/>
<rect x="40" y="18" width="880" height="52" rx="8" fill="#1B5E4B"/>
<text x="480" y="51" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">腎素－血管收縮素系統（RAS）路徑與納豆激酶作用示意</text>
<text x="220" y="92" text-anchor="middle" fill="#D32F2F" font-size="13" font-weight="bold">▶ 正常路徑（無介入）</text>
<text x="640" y="92" text-anchor="middle" fill="#2E8B6F" font-size="13" font-weight="bold">▶ 納豆激酶介入後</text>
<line x1="460" y1="80" x2="460" y2="545" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="60" y="108" width="300" height="54" rx="7" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
<text x="210" y="131" text-anchor="middle" fill="#1F2A28" font-size="13" font-weight="bold">血管收縮素 I</text>
<text x="210" y="151" text-anchor="middle" fill="#6B7B77" font-size="12">Angiotensin I</text>
<line x1="210" y1="162" x2="210" y2="197" stroke="#1B5E4B" stroke-width="2" marker-end="url(#ag)"/>
<text x="226" y="183" fill="#C9A227" font-size="12" font-weight="bold">ACE 作用</text>
<rect x="60" y="197" width="300" height="54" rx="7" fill="#FFF8E1" stroke="#C9A227" stroke-width="2"/>
<text x="210" y="220" text-anchor="middle" fill="#1F2A28" font-size="13" font-weight="bold">ACE 轉化酶</text>
<text x="210" y="241" text-anchor="middle" fill="#6B7B77" font-size="12">→ 血管收縮素 II（Angiotensin II）</text>
<line x1="210" y1="251" x2="210" y2="286" stroke="#D32F2F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="286" width="300" height="54" rx="7" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2"/>
<text x="210" y="310" text-anchor="middle" fill="#D32F2F" font-size="13" font-weight="bold">血管收縮</text>
<text x="210" y="330" text-anchor="middle" fill="#D32F2F" font-size="12">Vasoconstriction</text>
<line x1="210" y1="340" x2="210" y2="375" stroke="#D32F2F" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="375" width="300" height="54" rx="7" fill="#D32F2F" stroke="#B71C1C" stroke-width="2"/>
<text x="210" y="400" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">血壓升高 ↑</text>
<text x="210" y="420" text-anchor="middle" fill="#fff" font-size="12">High Blood Pressure</text>
<rect x="490" y="108" width="260" height="54" rx="7" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
<text x="620" y="131" text-anchor="middle" fill="#1F2A28" font-size="13" font-weight="bold">血管收縮素 I</text>
<text x="620" y="151" text-anchor="middle" fill="#6B7B77" font-size="12">Angiotensin I</text>
<line x1="620" y1="162" x2="620" y2="197" stroke="#1B5E4B" stroke-width="2" marker-end="url(#ag)"/>
<rect x="775" y="194" width="150" height="58" rx="7" fill="#E8F5E9" stroke="#2E8B6F" stroke-width="2"/>
<text x="850" y="217" text-anchor="middle" fill="#1B5E4B" font-size="13" font-weight="bold">納豆激酶</text>
<text x="850" y="235" text-anchor="middle" fill="#2E8B6F" font-size="11">Nattokinase</text>
<text x="850" y="250" text-anchor="middle" fill="#6B7B77" font-size="10">抑制 ACE 轉化</text>
<line x1="775" y1="223" x2="757" y2="223" stroke="#D32F2F" stroke-width="2.5" stroke-dasharray="5,3"/>
<line x1="754" y1="215" x2="754" y2="231" stroke="#D32F2F" stroke-width="3.5"/>
<circle cx="754" cy="223" r="9" fill="none" stroke="#D32F2F" stroke-width="2"/>
<rect x="490" y="197" width="260" height="54" rx="7" fill="#F2F7F5" stroke="#6B7B77" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="620" y="220" text-anchor="middle" fill="#6B7B77" font-size="12">ACE 轉化酶（受抑制）</text>
<text x="620" y="241" text-anchor="middle" fill="#6B7B77" font-size="12">Angiotensin II 生成量↓</text>
<line x1="620" y1="251" x2="620" y2="286" stroke="#2E8B6F" stroke-width="2" marker-end="url(#ag2)"/>
<rect x="490" y="286" width="260" height="54" rx="7" fill="#E8F5E9" stroke="#2E8B6F" stroke-width="2"/>
<text x="620" y="310" text-anchor="middle" fill="#1B5E4B" font-size="13" font-weight="bold">血管舒張</text>
<text x="620" y="330" text-anchor="middle" fill="#2E8B6F" font-size="12">Vasodilation</text>
<line x1="620" y1="340" x2="620" y2="375" stroke="#2E8B6F" stroke-width="2" marker-end="url(#ag2)"/>
<rect x="490" y="375" width="260" height="54" rx="7" fill="#1B5E4B" stroke="#0D4A35" stroke-width="2"/>
<text x="620" y="400" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">血壓趨於正常 ↓</text>
<text x="620" y="420" text-anchor="middle" fill="#fff" font-size="12">Lower Blood Pressure</text>
<text x="480" y="548" text-anchor="middle" fill="#6B7B77" font-size="11">※ 本圖為衛教說明示意，不作為醫療診斷或治療建議</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>