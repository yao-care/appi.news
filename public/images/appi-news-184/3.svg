<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="黑胡椒 5 件事整理：一、核心成分胡椒鹼占乾重 5–9%；二、動物減重研究可能抑制脂肪吸收但人體證據不足；三、礦物質含量可觀但日常用量極少；四、抑制 CYP3A4 提升薑黃素吸收力；五、注意族群使用補充品前先諮詢醫師">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.num{font-size:15px;font-weight:700;fill:#ffffff;}
.item{font-size:18px;font-weight:700;fill:#1e2030;}
.sub{font-size:13px;fill:#6e7276;}
.li{font-size:14px;fill:#1e2030;}
.chip{font-size:13px;font-weight:700;fill:#ffffff;}
.chipd{font-size:13px;font-weight:700;fill:#1f3a5f;}
.tag{font-size:12px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
.note{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">黑胡椒：5 件事整理</text>
<text x="58" y="90" class="deck">從胡椒鹼、減重研究到吸收力，一次看懂這罐每天轉幾下的香料</text>

<!-- 中線 -->
<line x1="480" y1="118" x2="480" y2="548" stroke="#e8e9ed" stroke-width="1"/>

<!-- 1 胡椒鹼 -->
<circle cx="64" cy="140" r="15" fill="#1f3a5f"/>
<text x="64" y="145" text-anchor="middle" class="num">1</text>
<text x="90" y="137" class="item">胡椒鹼（Piperine）</text>
<text x="90" y="156" class="sub">核心活性成分</text>
<line x1="48" y1="170" x2="460" y2="170" stroke="#e8e9ed" stroke-width="1"/>
<text x="48" y="196" class="li">・占乾重約 5–9%，辛辣感的主要來源</text>
<text x="48" y="220" class="li">・研究關注的核心生物活性物質</text>

<!-- 2 動物減重研究 -->
<circle cx="64" cy="290" r="15" fill="#1f3a5f"/>
<text x="64" y="295" text-anchor="middle" class="num">2</text>
<text x="90" y="287" class="item">動物減重研究</text>
<text x="90" y="306" class="sub">減重與腸道效應</text>
<line x1="48" y1="320" x2="460" y2="320" stroke="#e8e9ed" stroke-width="1"/>
<text x="48" y="346" class="li">・動物研究：可能抑制腸道脂肪吸收</text>
<text x="48" y="370" class="li">・有助修復腸道屏障、降低發炎</text>
<text x="48" y="394" class="li">・人體研究尚不充分，效果不宜過度期待</text>
<rect x="48" y="410" width="412" height="28" rx="6" fill="#eef0f3"/>
<text x="60" y="429" class="tag">大鼠試驗：高劑量 27 mg/kg 使體重下降約 5.7%</text>

<!-- 3 礦物質含量 -->
<circle cx="64" cy="470" r="15" fill="#1f3a5f"/>
<text x="64" y="475" text-anchor="middle" class="num">3</text>
<text x="90" y="467" class="item">礦物質含量</text>
<text x="90" y="486" class="sub">每 100g 分析數據，日常用量約 1–2g</text>
<line x1="48" y1="500" x2="460" y2="500" stroke="#e8e9ed" stroke-width="1"/>
<text x="48" y="524" class="li">・每 100g：鐵 9.7mg・鈣 443mg・鉀 1329mg</text>

<!-- 4 提升吸收力 -->
<circle cx="514" cy="140" r="15" fill="#1f3a5f"/>
<text x="514" y="145" text-anchor="middle" class="num">4</text>
<text x="540" y="137" class="item">提升吸收力機制</text>
<text x="540" y="156" class="sub">最有實用依據的功效</text>
<line x1="498" y1="170" x2="920" y2="170" stroke="#e8e9ed" stroke-width="1"/>
<text x="498" y="196" class="li">・抑制 CYP3A4 與 P-glycoprotein 代謝酵素</text>
<text x="498" y="220" class="li">・顯著提升薑黃素的生物利用率</text>
<text x="498" y="244" class="li">・促進脂溶性維生素 A、D、E、K 吸收</text>
<rect x="498" y="262" width="94" height="30" rx="6" fill="#1f3a5f"/>
<text x="545" y="282" text-anchor="middle" class="chip">薑黃素</text>
<text x="600" y="283" text-anchor="middle" font-size="18" font-weight="700" fill="#a87515">+</text>
<rect x="614" y="262" width="94" height="30" rx="6" fill="#a87515"/>
<text x="661" y="282" text-anchor="middle" class="chip">胡椒鹼</text>
<text x="716" y="283" text-anchor="middle" font-size="18" font-weight="700" fill="#a87515">→</text>
<rect x="730" y="262" width="130" height="30" rx="6" fill="#eaf0f8"/>
<text x="795" y="282" text-anchor="middle" class="chipd">吸收率提升</text>

<!-- 5 注意族群 -->
<circle cx="514" cy="352" r="15" fill="#1f3a5f"/>
<text x="514" y="357" text-anchor="middle" class="num">5</text>
<text x="540" y="349" class="item">注意族群</text>
<text x="540" y="368" class="sub">使用補充品前先諮詢醫師</text>
<line x1="498" y1="382" x2="920" y2="382" stroke="#e8e9ed" stroke-width="1"/>
<path d="M506 401 L514 415 L498 415 Z" fill="#a12a2a"/>
<text x="508" y="412.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="524" y="415" class="li">胃潰瘍／胃食道逆流：可能刺激胃黏膜</text>
<path d="M506 425 L514 439 L498 439 Z" fill="#a12a2a"/>
<text x="508" y="436.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="524" y="439" class="li">孕婦：不建議額外補充高劑量胡椒鹼萃取物</text>
<path d="M506 449 L514 463 L498 463 Z" fill="#a12a2a"/>
<text x="508" y="460.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="524" y="463" class="li">服用特定藥物者：影響肝臟代謝酵素</text>
<path d="M506 473 L514 487 L498 487 Z" fill="#a12a2a"/>
<text x="508" y="484.5" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">!</text>
<text x="524" y="487" class="li">陰虛體質者：辛熱之品不宜過量</text>

<!-- 衛教聲明 -->
<text x="480" y="548" text-anchor="middle" class="note">本圖為衛教資訊，不構成醫療建議</text>

<!-- 頁尾 -->
<line x1="40" y1="564" x2="920" y2="564" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="586" class="foot">製圖：APPI News</text>
<text x="920" y="586" text-anchor="end" class="foot">資料來源：胡椒鹼藥理研究（2021–2022 動物試驗與系統性回顧）</text>
</svg>
