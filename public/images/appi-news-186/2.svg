<text x="301" y="445" font-family="sans-serif" font-size="12" fill="#6B7B77"> 中等</text>
<text x="66" y="478" font-family="sans-serif" font-size="13" fill="#1F2A28">子彈種</text>
<rect x="138" y="464" width="100" height="20" rx="4" fill="#C9A227"/>
<text x="246" y="479" font-family="sans-serif" font-size="12" fill="#1B5E4B"> 較低 ✓</text>
<text x="247" y="512" font-family="sans-serif" font-size="12" fill="#6B7B77" text-anchor="middle">品種間含糖量有差異，可優先選擇含糖較低品種</text>
<text x="247" y="532" font-family="sans-serif" font-size="11" fill="#6B7B77" text-anchor="middle">※ 實際血糖反應因人而異</text>
