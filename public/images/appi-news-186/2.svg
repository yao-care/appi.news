<text x="713" y="252" font-family="sans-serif" font-size="12" fill="#1F2A28" text-anchor="middle">飯後食用有助緩和血糖快速上升</text>
<text x="713" y="274" font-family="sans-serif" font-size="11" fill="#6B7B77" text-anchor="middle">※ 請依醫師或營養師建議調整</text>
