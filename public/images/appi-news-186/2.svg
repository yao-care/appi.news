<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="糖尿病患者蓮霧食用指南四要點：每次 2 至 3 顆約 150 至 200 公克、安排在正餐後、依含糖量選品種、搭配蛋白質或健康脂肪">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.name{font-size:20px;font-weight:700;fill:#1e2030;}
.key{font-size:22px;font-weight:700;fill:#1e2030;}
.sub{font-size:15px;fill:#6e7276;}
.desc{font-size:14px;fill:#6e7276;}
.vlabel{font-size:14px;font-weight:700;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">糖尿病患者的蓮霧食用指南</text>
<text x="58" y="90" class="deck">低升糖水果也要控量：份量、時機、品種、搭配四件事看懂怎麼吃</text>

<!-- 焦點欄（份量）底色 -->
<rect x="46" y="132" width="208" height="380" rx="12" fill="#eaf0f8"/>
<rect x="58" y="132" width="184" height="3" rx="1.5" fill="#a87515"/>

<!-- 欄位分隔線 -->
<line x1="260" y1="152" x2="260" y2="494" stroke="#e8e9ed" stroke-width="1"/>
<line x1="480" y1="152" x2="480" y2="494" stroke="#e8e9ed" stroke-width="1"/>
<line x1="700" y1="152" x2="700" y2="494" stroke="#e8e9ed" stroke-width="1"/>

<!-- ── 份量（焦點） ── -->
<g>
  <text x="150" y="188" text-anchor="middle" class="name">份量</text>
  <circle cx="124" cy="262" r="13" fill="#a87515"/>
  <circle cx="150" cy="262" r="13" fill="#a87515"/>
  <circle cx="176" cy="262" r="13" fill="#a87515"/>
  <text x="150" y="358" text-anchor="middle" class="key">2–3 顆</text>
  <text x="150" y="384" text-anchor="middle" class="sub">約 150–200 公克</text>
  <text x="150" y="424" text-anchor="middle" class="desc">＝一份水果的量</text>
  <text x="150" y="448" text-anchor="middle" class="desc">低 GI 水果（GI&lt;55）</text>
  <text x="150" y="472" text-anchor="middle" class="desc">碳水 8–9g/100g</text>
</g>

<!-- ── 時機 ── -->
<g>
  <text x="370" y="188" text-anchor="middle" class="name">食用時機</text>
  <circle cx="370" cy="262" r="30" fill="#eef0f3" stroke="#d5d6da" stroke-width="1"/>
  <g stroke="#5e6070" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M370 262 L370 242"/>
    <path d="M370 262 L386 270"/>
  </g>
  <circle cx="370" cy="262" r="3" fill="#5e6070"/>
  <text x="370" y="358" text-anchor="middle" class="key">正餐後</text>
  <text x="370" y="384" text-anchor="middle" class="sub">1–2 小時</text>
  <text x="370" y="424" text-anchor="middle" class="desc">避免空腹大量吃</text>
  <text x="370" y="448" text-anchor="middle" class="desc">睡前也不宜多吃</text>
</g>

<!-- ── 品種選擇 ── -->
<g>
  <text x="590" y="188" text-anchor="middle" class="name">品種選擇</text>
  <!-- 含糖高低（形狀＋文字雙編碼） -->
  <text x="502" y="238" class="vlabel">黑珍珠</text>
  <rect x="560" y="226" width="14" height="14" rx="2" fill="#a87515"/>
  <rect x="578" y="226" width="14" height="14" rx="2" fill="#a87515"/>
  <rect x="596" y="226" width="14" height="14" rx="2" fill="#a87515"/>
  <text x="626" y="238" class="desc">含糖高</text>

  <text x="502" y="274" class="vlabel">粉紅種</text>
  <rect x="560" y="262" width="14" height="14" rx="2" fill="#a87515"/>
  <rect x="578" y="262" width="14" height="14" rx="2" fill="#a87515"/>
  <rect x="596" y="262" width="14" height="14" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <text x="626" y="274" class="desc">略低</text>

  <text x="502" y="310" class="vlabel">子彈種</text>
  <rect x="560" y="298" width="14" height="14" rx="2" fill="#a87515"/>
  <rect x="578" y="298" width="14" height="14" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <rect x="596" y="298" width="14" height="14" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <text x="626" y="310" class="desc">水分足</text>

  <text x="590" y="384" text-anchor="middle" class="sub">血糖較不穩時</text>
  <text x="590" y="424" text-anchor="middle" class="desc">優先選粉紅或子彈</text>
  <text x="590" y="448" text-anchor="middle" class="desc">口感較淡、糖分較低</text>
</g>

<!-- ── 聰明搭配 ── -->
<g>
  <text x="810" y="188" text-anchor="middle" class="name">聰明搭配</text>
  <circle cx="794" cy="262" r="15" fill="#a87515"/>
  <rect x="816" y="248" width="34" height="28" rx="6" fill="#eef0f3" stroke="#a87515" stroke-width="2"/>
  <text x="810" y="358" text-anchor="middle" class="key">搭蛋白質</text>
  <text x="810" y="384" text-anchor="middle" class="sub">或健康脂肪</text>
  <text x="810" y="424" text-anchor="middle" class="desc">幾顆堅果、</text>
  <text x="810" y="448" text-anchor="middle" class="desc">一片低脂起司</text>
  <text x="810" y="472" text-anchor="middle" class="desc">延緩血糖上升</text>
</g>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料：台灣糖尿病飲食建議・2026 年 6 月</text>
</svg>
