<circle cx="148" cy="192" r="50" fill="#2E8B6F" opacity="0.15"/>
<text x="148" y="182" font-family="sans-serif" font-size="36" font-weight="bold" fill="#1B5E4B" text-anchor="middle">2–3</text>
<text x="148" y="204" font-family="sans-serif" font-size="13" fill="#1F2A28" text-anchor="middle">顆（建議量）</text>
<text x="338" y="168" font-family="sans-serif" font-size="12" fill="#6B7B77" text-anchor="middle">每次份量</text>
<text x="338" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B" text-anchor="middle">150–200g</text>
<text x="338" y="216" font-family="sans-serif" font-size="11" fill="#6B7B77" text-anchor="middle">中型蓮霧每顆約 50–70 克</text>
<text x="247" y="256" font-family="sans-serif" font-size="12" fill="#6B7B77" text-anchor="middle">蓮霧熱量低、水分高，升糖指數(GI)約 50–55</text>
<text x="247" y="277" font-family="sans-serif" font-size="11" fill="#6B7B77" text-anchor="middle">※ 依個人血糖監測狀況調整，請諮詢醫師</text>
