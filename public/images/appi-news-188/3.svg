<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="紅黃綠標示上路前的食品選購五步驟：一看背面三個數字、二把紅燈當提醒而非禁令、三認清三燈全綠不等於健康、四優先選有標示產品、五不確定時回歸原型食物">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.num{font-size:20px;font-weight:700;fill:#ffffff;}
.name{font-size:18px;font-weight:700;fill:#1e2030;}
.desc{font-size:14px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">紅黃綠上路前：食品選購五步驟</text>
<text x="58" y="90" class="deck">現在就能用：從看懂背面標示，到不確定時回歸原型食物</text>

<!-- 焦點欄（第五步）底色 -->
<rect x="746" y="132" width="174" height="380" rx="12" fill="#eaf0f8"/>
<rect x="758" y="132" width="150" height="3" rx="1.5" fill="#a87515"/>

<!-- 欄位分隔線 -->
<line x1="216" y1="152" x2="216" y2="494" stroke="#e8e9ed" stroke-width="1"/>
<line x1="392" y1="152" x2="392" y2="494" stroke="#e8e9ed" stroke-width="1"/>
<line x1="568" y1="152" x2="568" y2="494" stroke="#e8e9ed" stroke-width="1"/>
<line x1="744" y1="152" x2="744" y2="494" stroke="#e8e9ed" stroke-width="1"/>

<!-- ① 看背面三個數字 -->
<g>
  <circle cx="128" cy="178" r="20" fill="#1f3a5f"/>
  <text x="128" y="185" text-anchor="middle" class="num">1</text>
  <text x="128" y="240" text-anchor="middle" class="name">看背面</text>
  <text x="128" y="263" text-anchor="middle" class="name">三個數字</text>
  <text x="128" y="308" text-anchor="middle" class="desc">找糖、鈉、飽和脂肪</text>
  <text x="128" y="330" text-anchor="middle" class="desc">糖&gt;15g、鈉&gt;500mg</text>
  <text x="128" y="352" text-anchor="middle" class="desc">飽和脂肪&gt;4.5g＝高</text>
</g>

<!-- ② 紅燈是提醒不是禁令 -->
<g>
  <circle cx="304" cy="178" r="20" fill="#1f3a5f"/>
  <text x="304" y="185" text-anchor="middle" class="num">2</text>
  <text x="304" y="240" text-anchor="middle" class="name">紅燈是提醒</text>
  <text x="304" y="263" text-anchor="middle" class="name">不是禁令</text>
  <text x="304" y="308" text-anchor="middle" class="desc">偶爾吃紅燈沒問題</text>
  <text x="304" y="330" text-anchor="middle" class="desc">別讓它成每日主食</text>
  <text x="304" y="352" text-anchor="middle" class="desc">常備多款紅燈才調整</text>
</g>

<!-- ③ 三燈全綠不等於健康 -->
<g>
  <circle cx="480" cy="178" r="20" fill="#1f3a5f"/>
  <text x="480" y="185" text-anchor="middle" class="num">3</text>
  <text x="480" y="240" text-anchor="middle" class="name">三燈全綠</text>
  <text x="480" y="263" text-anchor="middle" class="name">不等於健康</text>
  <text x="480" y="308" text-anchor="middle" class="desc">加工食品也能三綠</text>
  <text x="480" y="330" text-anchor="middle" class="desc">卻缺纖維與植化素</text>
  <text x="480" y="352" text-anchor="middle" class="desc">標示只是第一層篩選</text>
</g>

<!-- ④ 優先選有標示產品 -->
<g>
  <circle cx="656" cy="178" r="20" fill="#1f3a5f"/>
  <text x="656" y="185" text-anchor="middle" class="num">4</text>
  <text x="656" y="240" text-anchor="middle" class="name">優先選</text>
  <text x="656" y="263" text-anchor="middle" class="name">有標示產品</text>
  <text x="656" y="308" text-anchor="middle" class="desc">自願標示＝願意透明</text>
  <text x="656" y="330" text-anchor="middle" class="desc">選它也鼓勵更多</text>
  <text x="656" y="352" text-anchor="middle" class="desc">業者跟進標示</text>
</g>

<!-- ⑤ 回歸原型食物（焦點） -->
<g>
  <circle cx="832" cy="178" r="20" fill="#a87515"/>
  <text x="832" y="185" text-anchor="middle" class="num">5</text>
  <text x="832" y="240" text-anchor="middle" class="name">不確定時</text>
  <text x="832" y="263" text-anchor="middle" class="name">回歸原型食物</text>
  <text x="832" y="308" text-anchor="middle" class="desc">蔬菜、豆類、全穀類</text>
  <text x="832" y="330" text-anchor="middle" class="desc">新鮮魚肉等原型食物</text>
  <text x="832" y="352" text-anchor="middle" class="desc">根本不需要看標示</text>
</g>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料：衛福部食藥署・2026 年 6 月</text>
</svg>
