<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <style>
      text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="960" height="64" fill="#1B5E4B"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#FFFFFF">萊姆病三期病程進展</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#C9A227">症狀嚴重程度隨時間遞增</text>

  <!-- Severity Arrow Background -->
  <rect x="40" y="80" width="880" height="18" rx="9" fill="#F2F7F5"/>
  <rect x="40" y="80" width="880" height="18" rx="9" fill="url(#sevGrad)"/>
  <defs>
    <linearGradient id="sevGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E8B6F"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
  </defs>
  <polygon points="920,89 904,80 904,98" fill="#C0392B"/>
  <text x="480" y="77" text-anchor="middle" font-size="11" fill="#6B7B77">嚴重程度遞增 →</text>

  <!-- Stage 1 Panel -->
  <rect x="40" y="112" width="270" height="440" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
  <rect x="40" y="112" width="270" height="44" rx="10" fill="#2E8B6F"/>
  <rect x="40" y="136" width="270" height="20" fill="#2E8B6F"/>
  <text x="175" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">第一期</text>
  <text x="175" y="148" text-anchor="middle" font-size="12" fill="#FFFFFF">發病後 3–30 天</text>

  <!-- Bull's-eye rash icon -->
  <circle cx="175" cy="230" r="55" fill="none" stroke="#C0392B" stroke-width="2.5"/>
  <circle cx="175" cy="230" r="38" fill="none" stroke="#F2F7F5" stroke-width="8"/>
  <circle cx="175" cy="230" r="30" fill="none" stroke="#C0392B" stroke-width="2.5"/>
  <circle cx="175" cy="230" r="14" fill="#C0392B" opacity="0.7"/>
  <text x="175" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E4B">遊走性紅斑（靶心疹）</text>

  <!-- Stats badge -->
  <rect x="75" y="312" width="200" height="28" rx="14" fill="#C9A227"/>
  <text x="175" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2A28">70–80% 患者出現靶心疹</text>

  <!-- Symptoms Stage 1 -->
  <circle cx="68" cy="365" r="5" fill="#2E8B6F"/>
  <text x="82" y="369" font-size="13" fill="#1F2A28">發燒</text>
  <circle cx="68" cy="390" r="5" fill="#2E8B6F"/>
  <text x="82" y="394" font-size="13" fill="#1F2A28">疲勞倦怠</text>
  <circle cx="68" cy="415" r="5" fill="#2E8B6F"/>
  <text x="82" y="419" font-size="13" fill="#1F2A28">頭痛、肌肉痠痛</text>
  <circle cx="68" cy="440" r="5" fill="#2E8B6F"/>
  <text x="82" y="444" font-size="13" fill="#1F2A28">淋巴結腫大</text>

  <!-- Stage 2 Panel -->
  <rect x="345" y="112" width="270" height="440" rx="10" fill="#F2F7F5" stroke="#C9A227" stroke-width="2"/>
  <rect x="345" y="112" width="270" height="44" rx="10" fill="#C9A227"/>
  <rect x="345" y="136" width="270" height="20" fill="#C9A227"/>
  <text x="480" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2A28">第二期</text>
  <text x="480" y="148" text-anchor="middle" font-size="12" fill="#1F2A28">數週至數月後</text>

  <!-- Facial palsy icon -->
  <circle cx="480" cy="210" r="40" fill="none" stroke="#C9A227" stroke-width="2.5"/>
  <circle cx="465" cy="200" r="4" fill="#1F2A28"/>
  <circle cx="495" cy="200" r="4" fill="#1F2A28"/>
  <path d="M465,225 Q480,218 495,225" fill="none" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="455" y1="215" x2="445" y2="215" stroke="#C0392B" stroke-width="2"/>
  <text x="480" y="265" text-anchor="middle" font-size="12" fill="#6B7B77">面部神經麻痺示意</text>

  <!-- Heart icon -->
  <path d="M455,285 Q455,275 465,275 Q475,275 480,285 Q485,275 495,275 Q505,275 505,285 Q505,300 480,315 Q455,300 455,285Z" fill="#C0392B" opacity="0.8"/>
  <line x1="430" y1="295" x2="445" y2="295" stroke="#C9A227" stroke-width="2"/>
  <line x1="445" y1="295" x2="450" y2="285" stroke="#C9A227" stroke-width="2"/>
  <line x1="450" y1="285" x2="456" y2="300" stroke="#C9A227" stroke-width="2"/>
  <line x1="456" y1="300" x2="462" y2="295" stroke="#C9A227" stroke-width="2"/>

  <!-- Symptoms Stage 2 -->
  <circle cx="373" cy="345" r="5" fill="#C9A227"/>
  <text x="387" y="349" font-size="13" fill="#1F2A28">顏面神經麻痺</text>
  <circle cx="373" cy="370" r="5" fill="#C9A227"/>
  <text x="387" y="374" font-size="13" fill="#1F2A28">心律不整、心臟傳導障礙</text>
  <circle cx="373" cy="395" r="5" fill="#C9A227"/>
  <text x="387" y="399" font-size="13" fill="#1F2A28">遊走性關節疼痛</text>
  <circle cx="373" cy="420" r="5" fill="#C9A227"/>
  <text x="387" y="424" font-size="13" fill="#1F2A28">神經系統症狀</text>
  <circle cx="373" cy="445" r="5" fill="#C9A227"/>
  <text x="387" y="449" font-size="13" fill="#1F2A28">脊髓炎、腦膜炎</text>

  <!-- Stage 3 Panel -->
  <rect x="650" y="112" width="270" height="440" rx="10" fill="#F2F7F5" stroke="#C0392B" stroke-width="2"/>
  <rect x="650" y="112" width="270" height="44" rx="10" fill="#C0392B"/>
  <rect x="650" y="136" width="270" height="20" fill="#C0392B"/>
  <text x="785" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">第三期</text>
  <text x="785" y="148" text-anchor="middle" font-size="12" fill="#FFFFFF">數月至數年後</text>

  <!-- Joint icon -->
  <ellipse cx="785" cy="200" rx="30" ry="18" fill="none" stroke="#C0392B" stroke-width="2.5"/>
  <ellipse cx="785" cy="200" rx="18" ry="10" fill="#C0392B" opacity="0.25"/>
  <line x1="755" y1="200" x2="730" y2="185" stroke="#1B5E4B" stroke-width="5" stroke-linecap="round"/>
  <line x1="815" y1="200" x2="840" y2="215" stroke="#1B5E4B" stroke-width="5" stroke-linecap="round"/>
  <text x="785" y="235" text-anchor="middle" font-size="12" fill="#6B7B77">慢性關節炎示意</text>

  <!-- Brain fog icon -->
  <ellipse cx="785" cy="285" rx="32" ry="24" fill="none" stroke="#C0392B" stroke-width="2"/>
  <ellipse cx="770" cy="278" rx="12" ry="9" fill="none" stroke="#C0392B" stroke-width="1.5"/>
  <ellipse cx="800" cy="278" rx="12" ry="9" fill="none" stroke="#C0392B" stroke-width="1.5"/>
  <line x1="760" y1="296" x2="760" y2="306" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="785" y1="310" x2="785" y2="320" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="810" y1="296" x2="810" y2="306" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="785" y="335" text-anchor="middle" font-size="12" fill="#6B7B77">腦霧示意</text>

  <!-- Symptoms Stage 3 -->
  <circle cx="678" cy="365" r="5" fill="#C0392B"/>
  <text x="692" y="369" font-size="13" fill="#1F2A28">慢性關節炎（尤以膝關節）</text>
  <circle cx="678" cy="390" r="5" fill="#C0392B"/>
  <text x="692" y="394" font-size="13" fill="#1F2A28">腦霧（思考與記憶障礙）</text>
  <circle cx="678" cy="415" r="5" fill="#C0392B"/>
  <text x="692" y="419" font-size="13" fill="#1F2A28">持續性疲勞</text>
  <circle cx="678" cy="440" r="5" fill="#C0392B"/>
  <text x="692" y="444" font-size="13" fill="#1F2A28">周邊神經病變</text>

  <!-- Footer -->
  <rect x="0" y="568" width="960" height="32" fill="#F2F7F5"/>
  <text x="480" y="588" text-anchor="middle" font-size="11" fill="#6B7B77">資料來源：疾管署衛教資訊。本圖表僅供衛教參考，如有相關症狀請就醫診斷。</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>