<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="萊姆病三期病程時間軸：第一期叮咬後 3 到 30 天出現遊走性紅斑（70 至 80% 患者），第二期數週至數月後出現顏面神經麻痺與心臟傳導異常，第三期數月至數年後為慢性關節炎與腦霧，嚴重程度隨時間遞增">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.axis{font-size:13px;fill:#6e7276;}
.name{font-size:20px;font-weight:700;fill:#1e2030;}
.phase{font-size:14px;fill:#6e7276;}
.time{font-size:16px;font-weight:700;fill:#1e2030;}
.sev{font-size:14px;font-weight:700;fill:#1e2030;}
.sym{font-size:14px;fill:#1e2030;}
.stat{font-size:13px;font-weight:700;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">萊姆病三期病程時間軸</text>
<text x="58" y="90" class="deck">從遊走性紅斑到慢性關節炎，症狀嚴重程度隨時間遞增，越早發現越好處理</text>

<!-- 時間軸 -->
<text x="894" y="122" text-anchor="end" class="axis">症狀嚴重程度隨時間遞增 →</text>
<line x1="66" y1="140" x2="884" y2="140" stroke="#e8e9ed" stroke-width="2"/>
<path d="M884 134 L896 140 L884 146 Z" fill="#6e7276"/>
<circle cx="213" cy="140" r="7" fill="#1f3a5f"/>
<circle cx="480" cy="140" r="7" fill="#a87515"/>
<circle cx="747" cy="140" r="7" fill="#a12a2a"/>

<!-- 焦點欄（第一期）底色 -->
<rect x="52" y="168" width="278" height="368" rx="12" fill="#eaf0f8"/>
<rect x="64" y="168" width="254" height="3" rx="1.5" fill="#a87515"/>

<!-- 欄位分隔線 -->
<line x1="333" y1="188" x2="333" y2="520" stroke="#e8e9ed" stroke-width="1"/>
<line x1="626" y1="188" x2="626" y2="520" stroke="#e8e9ed" stroke-width="1"/>

<!-- ── 第一期（焦點） ── -->
<g>
  <text x="213" y="216" text-anchor="middle" class="name">第一期</text>
  <text x="213" y="240" text-anchor="middle" class="phase">早期局部感染</text>
  <text x="213" y="272" text-anchor="middle" class="time">叮咬後 3–30 天</text>
  <text x="213" y="294" text-anchor="middle" class="phase">（平均 7 天）</text>
  <!-- 嚴重度：輕 -->
  <rect x="176" y="314" width="20" height="12" rx="2" fill="#a87515"/>
  <rect x="200" y="306" width="20" height="20" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <rect x="224" y="298" width="20" height="28" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <text x="256" y="322" class="sev">輕度</text>
  <!-- 症狀 -->
  <circle cx="84" cy="360" r="4" fill="#1f3a5f"/>
  <text x="100" y="365" class="sym">遊走性紅斑（牛眼狀）</text>
  <circle cx="84" cy="390" r="4" fill="#1f3a5f"/>
  <text x="100" y="395" class="sym">發燒、頭痛</text>
  <circle cx="84" cy="420" r="4" fill="#1f3a5f"/>
  <text x="100" y="425" class="sym">肌肉痠痛、疲勞</text>
  <circle cx="84" cy="450" r="4" fill="#1f3a5f"/>
  <text x="100" y="455" class="sym">淋巴結腫大</text>
  <text x="84" y="500" class="stat">牛眼疹：70–80% 早期患者會出現</text>
</g>

<!-- ── 第二期 ── -->
<g>
  <text x="480" y="216" text-anchor="middle" class="name">第二期</text>
  <text x="480" y="240" text-anchor="middle" class="phase">早期播散性感染</text>
  <text x="480" y="272" text-anchor="middle" class="time">數週至數月後</text>
  <!-- 嚴重度：中 -->
  <rect x="443" y="314" width="20" height="12" rx="2" fill="#a87515"/>
  <rect x="467" y="306" width="20" height="20" rx="2" fill="#a87515"/>
  <rect x="491" y="298" width="20" height="28" rx="2" fill="none" stroke="#c9ac72" stroke-width="1.5"/>
  <text x="523" y="322" class="sev">中度</text>
  <!-- 症狀 -->
  <circle cx="376" cy="360" r="4" fill="#a87515"/>
  <text x="392" y="365" class="sym">多發性紅斑</text>
  <circle cx="376" cy="390" r="4" fill="#a87515"/>
  <text x="392" y="395" class="sym">顏面神經麻痺</text>
  <circle cx="376" cy="420" r="4" fill="#a87515"/>
  <text x="392" y="425" class="sym">心臟傳導異常</text>
  <circle cx="376" cy="450" r="4" fill="#a87515"/>
  <text x="392" y="455" class="sym">關節炎初發</text>
</g>

<!-- ── 第三期 ── -->
<g>
  <text x="747" y="216" text-anchor="middle" class="name">第三期</text>
  <text x="747" y="240" text-anchor="middle" class="phase">晚期慢性感染</text>
  <text x="747" y="272" text-anchor="middle" class="time">數月至數年後</text>
  <!-- 嚴重度：重 -->
  <rect x="710" y="314" width="20" height="12" rx="2" fill="#a12a2a"/>
  <rect x="734" y="306" width="20" height="20" rx="2" fill="#a12a2a"/>
  <rect x="758" y="298" width="20" height="28" rx="2" fill="#a12a2a"/>
  <text x="790" y="322" class="sev">重度</text>
  <!-- 症狀 -->
  <circle cx="668" cy="360" r="4" fill="#a12a2a"/>
  <text x="684" y="365" class="sym">慢性關節炎</text>
  <circle cx="668" cy="390" r="4" fill="#a12a2a"/>
  <text x="684" y="395" class="sym">神經認知模糊（腦霧）</text>
  <circle cx="668" cy="420" r="4" fill="#a12a2a"/>
  <text x="684" y="425" class="sym">持續性疲勞</text>
  <circle cx="668" cy="450" r="4" fill="#a12a2a"/>
  <text x="684" y="455" class="sym">記憶力下降</text>
</g>

<!-- 頁尾 -->
<line x1="40" y1="546" x2="920" y2="546" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="572" class="foot">製圖：APPI News</text>
<text x="920" y="572" text-anchor="end" class="foot">資料：美國 CDC、疾管署衛教資訊</text>
</svg>
