<circle cx="725" cy="307" r="15" fill="#C9A227"/>
<polyline points="715,307 722,315 736,294" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="823" cy="307" r="15" fill="#C9A227"/>
<polyline points="813,307 820,315 834,294" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="800" y="348" text-anchor="middle" class="pt">不讓鼠吃</text>
<text x="800" y="375" text-anchor="middle" class="lb">密封食物並加蓋垃圾桶</text>
<text x="800" y="398" text-anchor="middle" class="sl">食物以密封容器存放</text>
<text x="800" y="418" text-anchor="middle" class="sl">徹底斷絕老鼠食物來源</text>

<text x="480" y="590" text-anchor="middle" font-size="12" fill="#6B7B77">三管齊下，有效防制鼠害，守護居家衛生安全</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>