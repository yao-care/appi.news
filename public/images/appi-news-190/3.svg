<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="防鼠三不居家防鼠原則：不讓鼠進（封堵管線孔、門縫、排水口，縫隙僅2.5公分就能鑽過）、不讓鼠住（清空紙箱雜物堆、去除築巢掩護）、不讓鼠吃（食物與寵物飼料密封、垃圾加蓋）">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.head{font-size:22px;font-weight:700;fill:#1e2030;}
.desc{font-size:14px;fill:#6e7276;}
.hi{font-size:14px;font-weight:700;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">防鼠三不：把老鼠擋在進門之前</text>
<text x="58" y="90" class="deck">封阻入口、清除棲地、斷絕食源——預防勝於事後清掃</text>

<!-- 焦點欄（不讓鼠進：根本之道） -->
<rect x="48" y="126" width="276" height="362" rx="12" fill="#eaf0f8"/>
<rect x="60" y="126" width="252" height="3" rx="1.5" fill="#a87515"/>

<!-- 欄位分隔線 -->
<line x1="333" y1="150" x2="333" y2="474" stroke="#e8e9ed" stroke-width="1"/>
<line x1="627" y1="150" x2="627" y2="474" stroke="#e8e9ed" stroke-width="1"/>

<!-- ── 不讓鼠進 ── -->
<g>
  <circle cx="186" cy="190" r="34" fill="#a87515"/>
  <g transform="translate(186 190)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-13 -13 h26 v26 h-26 Z"/>
    <path d="M-13 -4 H13 M-13 5 H13 M-4 -13 V13 M5 -13 V13"/>
  </g>
  <text x="186" y="272" text-anchor="middle" class="head">不讓鼠進</text>
  <text x="186" y="314" text-anchor="middle" class="desc">封堵管線孔、門縫、排水口</text>
  <text x="186" y="340" text-anchor="middle" class="desc">用填縫劑或金屬網補實</text>
  <text x="186" y="366" text-anchor="middle" class="hi">縫隙僅 2.5 公分就能鑽過</text>
</g>

<!-- ── 不讓鼠住 ── -->
<g>
  <circle cx="480" cy="190" r="34" fill="#a87515"/>
  <g transform="translate(480 190)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-13 -11 h12 v12 h-12 Z"/>
    <path d="M1 -1 h12 v12 h-12 Z"/>
    <path d="M-15 14 L15 -12"/>
  </g>
  <text x="480" y="272" text-anchor="middle" class="head">不讓鼠住</text>
  <text x="480" y="314" text-anchor="middle" class="desc">清空紙箱、布料等雜物堆</text>
  <text x="480" y="340" text-anchor="middle" class="desc">雜物是老鼠築巢的掩護</text>
  <text x="480" y="366" text-anchor="middle" class="desc">儲藏空間保持整潔</text>
</g>

<!-- ── 不讓鼠吃 ── -->
<g>
  <circle cx="774" cy="190" r="34" fill="#a87515"/>
  <g transform="translate(774 190)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-11 -3 L11 -3 L8 13 L-8 13 Z"/>
    <path d="M-14 -3 H14"/>
    <path d="M-4 -3 V-7 h8 V-3"/>
  </g>
  <text x="774" y="272" text-anchor="middle" class="head">不讓鼠吃</text>
  <text x="774" y="314" text-anchor="middle" class="desc">食物、寵物飼料密封存放</text>
  <text x="774" y="340" text-anchor="middle" class="desc">廚餘與垃圾桶都加蓋</text>
  <text x="774" y="366" text-anchor="middle" class="desc">不留開放的食物碎屑</text>
</g>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料來源：衛福部疾病管制署「防鼠三不」</text>
</svg>
