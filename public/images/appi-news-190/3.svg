<rect x="215" y="225" width="40" height="28" rx="2" fill="#2E8B6F" opacity="0.7"/>
<text x="160" y="285" text-anchor="middle" font-size="11" fill="#C9A227">金屬網 + 矽利康封堵</text>
<text x="160" y="330" text-anchor="middle" class="pt">不讓鼠進</text>
<text x="160" y="357" text-anchor="middle" class="lb">封堵縫隙與管線孔洞</text>
<text x="160" y="380" text-anchor="middle" class="sl">以金屬網、矽利康填補</text>
<text x="160" y="400" text-anchor="middle" class="sl">每一道可能入侵的縫隙</text>

<!-- Panel 2: No Shelter -->
<rect x="340" y="100" width="280" height="470" rx="12" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
<circle cx="480" cy="148" r="28" fill="#1B5E4B"/>
<text x="480" y="157" text-anchor="middle" font-size="22" font-weight="700" fill="#C9A227">2</text>
<rect x="365" y="200" width="55" height="45" rx="3" fill="#6B7B77" opacity="0.4" stroke="#6B7B77"/>
<rect x="427" y="208" width="45" height="37" rx="3" fill="#6B7B77" opacity="0.4" stroke="#6B7B77"/>
<rect x="375" y="248" width="75" height="50" rx="3" fill="#6B7B77" opacity="0.4" stroke="#6B7B77"/>
