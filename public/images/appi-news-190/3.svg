<path d="M 460 228 L 508 228 L 498 218 M 508 228 L 498 238" stroke="#1B5E4B" stroke-width="2.5" fill="none"/>
<rect x="512" y="198" width="93" height="100" rx="5" fill="#fff" stroke="#2E8B6F" stroke-width="1.5"/>
<text x="558" y="254" text-anchor="middle" font-size="13" fill="#2E8B6F">清空整潔</text>
<text x="480" y="330" text-anchor="middle" class="pt">不讓鼠住</text>
<text x="480" y="357" text-anchor="middle" class="lb">清除紙箱與雜物堆積</text>
<text x="480" y="380" text-anchor="middle" class="sl">定期整理儲藏空間</text>
<text x="480" y="400" text-anchor="middle" class="sl">杜絕老鼠藏匿築巢</text>

<!-- Panel 3: No Food -->
<rect x="660" y="100" width="280" height="470" rx="12" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
<circle cx="800" cy="148" r="28" fill="#1B5E4B"/>
