<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<defs><style>text{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif}.hd{font-size:28px;font-weight:700;fill:#fff}.st{font-size:13px;fill:#C9A227}.pt{font-size:20px;font-weight:700;fill:#1B5E4B}.lb{font-size:14px;fill:#1F2A28}.sl{font-size:12px;fill:#6B7B77}</style></defs>
<rect width="960" height="600" fill="#fff"/>
<rect width="960" height="80" fill="#1B5E4B"/>
<text x="480" y="48" text-anchor="middle" class="hd">防鼠三不原則</text>
<text x="480" y="70" text-anchor="middle" class="st">不讓鼠進 · 不讓鼠住 · 不讓鼠吃</text>

<!-- Panel 1: No Entry -->
