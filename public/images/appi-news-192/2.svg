<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<style>text{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;}</style>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect width="960" height="78" fill="#1B5E4B"/>
<text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="bold">躁鬱症早期警訊</text>
<text x="480" y="65" text-anchor="middle" fill="#C9A227" font-size="13">認識兩種發作期的信號，有助於早期察覺、適時尋求協助</text>
<rect x="28" y="88" width="440" height="468" rx="10" fill="#F2F7F5"/>
<rect x="28" y="88" width="440" height="52" rx="10" fill="#2E8B6F"/>
<rect x="28" y="118" width="440" height="22" fill="#2E8B6F"/>
<text x="248" y="121" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">躁狂／輕躁期警訊</text>
<circle cx="55" cy="162" r="6" fill="#C9A227"/>
<text x="70" y="167" fill="#1F2A28" font-size="15" font-weight="bold">睡眠需求大幅減少</text>
<text x="70" y="183" fill="#6B7B77" font-size="12">僅睡幾小時卻仍感到精力充沛</text>
<circle cx="55" cy="214" r="6" fill="#C9A227"/>
<text x="70" y="219" fill="#1F2A28" font-size="15" font-weight="bold">思緒快速奔馳、難以停歇</text>
<text x="70" y="235" fill="#6B7B77" font-size="12">想法不斷湧現，跳躍轉換迅速</text>
<circle cx="55" cy="266" r="6" fill="#C9A227"/>
<text x="70" y="271" fill="#1F2A28" font-size="15" font-weight="bold">衝動行為明顯增加</text>
<text x="70" y="287" fill="#6B7B77" font-size="12">衝動消費、魯莽決策或冒險行事</text>
<circle cx="55" cy="318" r="6" fill="#C9A227"/>
<text x="70" y="323" fill="#1F2A28" font-size="15" font-weight="bold">言語急促、滔滔不絕</text>
<text x="70" y="339" fill="#6B7B77" font-size="12">說話速度加快，難以讓他人插話</text>
<circle cx="55" cy="370" r="6" fill="#C9A227"/>
<text x="70" y="375" fill="#1F2A28" font-size="15" font-weight="bold">自信心異常高漲</text>
<text x="70" y="391" fill="#6B7B77" font-size="12">誇大自身能力，感覺無所不能</text>
<circle cx="55" cy="422" r="6" fill="#C9A227"/>
<text x="70" y="427" fill="#1F2A28" font-size="15" font-weight="bold">活動量與社交急遽增加</text>
<text x="70" y="443" fill="#6B7B77" font-size="12">大量投入計畫，精力難以靜下來</text>
<rect x="492" y="88" width="440" height="468" rx="10" fill="#F2F7F5"/>
<rect x="492" y="88" width="440" height="52" rx="10" fill="#1B5E4B"/>
<rect x="492" y="118" width="440" height="22" fill="#1B5E4B"/>
<text x="712" y="121" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">憂鬱期警訊</text>
<circle cx="519" cy="162" r="6" fill="#2E8B6F"/>
<text x="534" y="167" fill="#1F2A28" font-size="15" font-weight="bold">持續情緒低落或空洞感</text>
<text x="534" y="183" fill="#6B7B77" font-size="12">長時間感到悲傷、絕望或麻木</text>
<circle cx="519" cy="214" r="6" fill="#2E8B6F"/>
<text x="534" y="219" fill="#1F2A28" font-size="15" font-weight="bold">對原有興趣失去熱忱</text>
<text x="534" y="235" fill="#6B7B77" font-size="12">過去喜愛的活動再也提不起勁</text>
<circle cx="519" cy="266" r="6" fill="#2E8B6F"/>
<text x="534" y="271" fill="#1F2A28" font-size="15" font-weight="bold">睡眠異常（過多或失眠）</text>
<text x="534" y="287" fill="#6B7B77" font-size="12">難以入睡，或整日昏睡不醒</text>
<circle cx="519" cy="318" r="6" fill="#2E8B6F"/>
<text x="534" y="323" fill="#1F2A28" font-size="15" font-weight="bold">疲倦感強烈、行動遲緩</text>
<text x="534" y="339" fill="#6B7B77" font-size="12">即使休息後仍感到精疲力竭</text>
<circle cx="519" cy="370" r="6" fill="#2E8B6F"/>
<text x="534" y="375" fill="#1F2A28" font-size="15" font-weight="bold">注意力與記憶力下降</text>
<text x="534" y="391" fill="#6B7B77" font-size="12">難以集中精神，決策猶豫不定</text>
<circle cx="519" cy="422" r="6" fill="#2E8B6F"/>
<text x="534" y="427" fill="#1F2A28" font-size="15" font-weight="bold">社交退縮、孤立傾向</text>
<text x="534" y="443" fill="#6B7B77" font-size="12">回避親友互動，傾向獨自封閉</text>
<rect x="0" y="562" width="960" height="38" fill="#F2F7F5"/>
<line x1="0" y1="562" x2="960" y2="562" stroke="#2E8B6F" stroke-width="1.5"/>
<text x="480" y="585" text-anchor="middle" fill="#6B7B77" font-size="12">※ 以上資訊僅供參考，如有相關症狀請尋求專業醫療人員評估</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>