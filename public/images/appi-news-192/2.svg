<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="躁鬱症早期警訊並列：左欄躁狂或輕躁期（睡眠需求驟降、思維跳躍加速、衝動明顯增加、計畫暴增使命感強），右欄憂鬱期（動力與興趣下降、思維遲緩、社交退縮、睡眠過多或破碎）；情緒高漲卻同時焦躁疲倦絕望的混合狀態最危險，須立即就醫">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.colh{font-size:20px;font-weight:700;fill:#1e2030;}
.item{font-size:16px;font-weight:700;fill:#1e2030;}
.sub{font-size:13px;fill:#6e7276;}
.alert{font-size:17px;font-weight:700;fill:#a12a2a;}
.alsub{font-size:14px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">躁鬱症的早期警訊</text>
<text x="58" y="90" class="deck">睡眠、思緒、衝動的異常變化，往往是發作前數天的預警</text>

<!-- 欄位分隔線 -->
<line x1="480" y1="128" x2="480" y2="404" stroke="#e8e9ed" stroke-width="1"/>

<!-- 左欄標頭：躁狂／輕躁期（向上＝情緒高漲） -->
<circle cx="70" cy="150" r="20" fill="#a87515"/>
<g transform="translate(70 150)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M0 9 L0 -8 M-7 -1 L0 -9 L7 -1"/>
</g>
<text x="102" y="157" class="colh">躁狂／輕躁期警訊</text>

<!-- 右欄標頭：憂鬱期（向下＝情緒低落） -->
<circle cx="522" cy="150" r="20" fill="#1f3a5f"/>
<g transform="translate(522 150)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M0 -9 L0 8 M-7 1 L0 9 L7 1"/>
</g>
<text x="554" y="157" class="colh">憂鬱期警訊</text>

<!-- 左欄項目 -->
<g>
  <circle cx="58" cy="212" r="5.5" fill="#a87515"/>
  <text x="76" y="217" class="item">睡眠需求驟降</text>
  <text x="76" y="236" class="sub">睡約四小時就覺得充足，卻不疲累</text>

  <circle cx="58" cy="259" r="5.5" fill="#a87515"/>
  <text x="76" y="264" class="item">思維跳躍加速</text>
  <text x="76" y="283" class="sub">想法大量湧現，停不下來</text>

  <circle cx="58" cy="306" r="5.5" fill="#a87515"/>
  <text x="76" y="311" class="item">衝動明顯增加</text>
  <text x="76" y="330" class="sub">過度消費、高風險決策、性衝動提高</text>

  <circle cx="58" cy="353" r="5.5" fill="#a87515"/>
  <text x="76" y="358" class="item">計畫暴增、使命感強</text>
  <text x="76" y="377" class="sub">突然制定大量計畫，靜不下來</text>
</g>

<!-- 右欄項目 -->
<g>
  <circle cx="510" cy="212" r="5.5" fill="#1f3a5f"/>
  <text x="528" y="217" class="item">動力與興趣下降</text>
  <text x="528" y="236" class="sub">對原本喜歡的事失去反應</text>

  <circle cx="510" cy="259" r="5.5" fill="#1f3a5f"/>
  <text x="528" y="264" class="item">思維遲緩</text>
  <text x="528" y="283" class="sub">「腦子像在泥裡跑」</text>

  <circle cx="510" cy="306" r="5.5" fill="#1f3a5f"/>
  <text x="528" y="311" class="item">社交退縮</text>
  <text x="528" y="330" class="sub">回訊變慢、拒絕見面</text>

  <circle cx="510" cy="353" r="5.5" fill="#1f3a5f"/>
  <text x="528" y="358" class="item">睡眠過多或破碎</text>
  <text x="528" y="377" class="sub">怎麼睡都睡不夠</text>
</g>

<!-- 危險警示：混合狀態 -->
<rect x="40" y="424" width="880" height="80" rx="12" fill="#f7ecec"/>
<path d="M78 444 L98 480 L58 480 Z" fill="none" stroke="#a12a2a" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="78" y1="458" x2="78" y2="470" stroke="#a12a2a" stroke-width="3" stroke-linecap="round"/>
<circle cx="78" cy="475" r="1.7" fill="#a12a2a"/>
<text x="120" y="459" class="alert">混合狀態是最危險的訊號，須立即就醫</text>
<text x="120" y="486" class="alsub">情緒高漲卻同時焦躁、疲倦或絕望（「精力充沛但想死」），請立刻聯繫精神科或心理健康專線</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料來源：WHO、NIMH 雙向情緒障礙衛教</text>
</svg>
