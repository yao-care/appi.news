<rect x="272" y="110" width="178" height="20" fill="#C9A227"/>
<text x="361" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">第二期</text>
<ellipse cx="361" cy="200" rx="52" ry="38" fill="#F5CBA7" stroke="#C9A227" stroke-width="2"/>
