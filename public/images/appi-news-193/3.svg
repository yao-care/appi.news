<text x="583" y="289" text-anchor="middle" font-size="11" fill="#6B7B77">細胞型態異常</text>
<text x="583" y="309" text-anchor="middle" font-size="11" fill="#6B7B77">增生不規則</text>
<text x="583" y="329" text-anchor="middle" font-size="11" fill="#6B7B77">癌前病變</text>
<rect x="513" y="390" width="140" height="32" rx="7" fill="#E07B2A"/>
<text x="583" y="411" text-anchor="middle" font-size="12" fill="#fff">危險性：高</text>

<line x1="682" y1="265" x2="699" y2="265" stroke="#C0392B" stroke-width="3"/>
<polygon points="699,258 714,265 699,272" fill="#C0392B"/>

<rect x="716" y="85" width="178" height="360" rx="10" fill="#F2F7F5" stroke="#C0392B" stroke-width="2"/>
