<rect x="716" y="110" width="178" height="20" fill="#C0392B"/>
<text x="805" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">第四期</text>
<ellipse cx="805" cy="200" rx="50" ry="36" fill="#E88080" stroke="#C0392B" stroke-width="2"/>
<path d="M778,198 Q790,181 805,192 Q818,179 829,196 Q839,189 841,207 Q833,222 818,219 Q808,230 796,221 Q782,224 775,210 Z" fill="#C0392B" opacity="0.72"/>
<text x="805" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A28">口腔鱗狀細胞癌</text>
<text x="805" y="289" text-anchor="middle" font-size="11" fill="#6B7B77">惡性腫瘤形成</text>
<text x="805" y="309" text-anchor="middle" font-size="11" fill="#6B7B77">侵犯周邊組織</text>
<text x="805" y="329" text-anchor="middle" font-size="11" fill="#6B7B77">需積極治療</text>
<rect x="735" y="390" width="140" height="32" rx="7" fill="#C0392B"/>
<text x="805" y="411" text-anchor="middle" font-size="12" fill="#fff">危險性：極高</text>

<rect x="50" y="467" width="840" height="10" rx="5" fill="#F2F7F5"/>
<rect x="50" y="467" width="210" height="10" rx="5" fill="#2E8B6F"/>
<rect x="260" y="467" width="210" height="10" fill="#C9A227"/>
<rect x="470" y="467" width="210" height="10" fill="#E07B2A"/>
<rect x="680" y="467" width="210" height="10" rx="5" fill="#C0392B"/>
<text x="155" y="492" text-anchor="middle" font-size="11" fill="#2E8B6F">正常</text>
<text x="365" y="492" text-anchor="middle" font-size="11" fill="#C9A227">前驅病變</text>
<text x="575" y="492" text-anchor="middle" font-size="11" fill="#E07B2A">癌前病變</text>
<text x="785" y="492" text-anchor="middle" font-size="11" fill="#C0392B">惡性腫瘤</text>
<text x="480" y="530" text-anchor="middle" font-size="11" fill="#6B7B77">※ 早期發現、早期治療，定期口腔檢查是預防關鍵</text>
<text x="480" y="552" text-anchor="middle" font-size="10" fill="#6B7B77">本圖僅供衛教參考，不作為診斷依據，請諮詢專業醫療人員</text>
