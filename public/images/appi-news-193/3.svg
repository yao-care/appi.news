<rect x="342" y="211" width="17" height="10" rx="3" fill="#eee" stroke="#C9A227" stroke-width="1"/>
<text x="361" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2A28">纖維化與白斑</text>
<text x="361" y="289" text-anchor="middle" font-size="11" fill="#6B7B77">出現白色斑塊</text>
<text x="361" y="309" text-anchor="middle" font-size="11" fill="#6B7B77">組織變硬僵化</text>
<text x="361" y="329" text-anchor="middle" font-size="11" fill="#6B7B77">張口困難</text>
<rect x="291" y="390" width="140" height="32" rx="7" fill="#C9A227"/>
<text x="361" y="411" text-anchor="middle" font-size="12" fill="#fff">危險性：中</text>

<line x1="460" y1="265" x2="477" y2="265" stroke="#E07B2A" stroke-width="3"/>
