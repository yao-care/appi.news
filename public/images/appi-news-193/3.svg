<rect x="50" y="110" width="178" height="20" fill="#2E8B6F"/>
<text x="139" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">第一期</text>
<circle cx="139" cy="200" r="45" fill="#A8D5C2" stroke="#2E8B6F" stroke-width="2"/>
<ellipse cx="127" cy="196" rx="15" ry="11" fill="#7EC8A4"/>
