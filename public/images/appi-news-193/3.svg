<text x="139" y="289" text-anchor="middle" font-size="11" fill="#6B7B77">健康粉紅色組織</text>
<text x="139" y="309" text-anchor="middle" font-size="11" fill="#6B7B77">表面光滑均勻</text>
<text x="139" y="329" text-anchor="middle" font-size="11" fill="#6B7B77">無異常病灶</text>
<rect x="69" y="390" width="140" height="32" rx="7" fill="#2E8B6F"/>
<text x="139" y="411" text-anchor="middle" font-size="12" fill="#fff">危險性：低</text>

