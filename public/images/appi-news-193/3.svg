<rect x="494" y="110" width="178" height="20" fill="#E07B2A"/>
<text x="583" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">第三期</text>
<ellipse cx="583" cy="200" rx="52" ry="38" fill="#F5A67A" stroke="#E07B2A" stroke-width="2"/>
<circle cx="566" cy="196" r="9" fill="#E07B2A" opacity="0.55"/>
