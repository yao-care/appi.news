<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="口腔黏膜病變四階段進程：正常黏膜（風險低）→ 黏膜下纖維化與白斑（癌前病變，黏膜硬化張口困難）→ 上皮發育不良（癌前病變惡化，細胞異常增生）→ 口腔鱗狀細胞癌（惡性腫瘤，侵犯周邊組織）；嚼食檳榔者罹患口腔癌風險約為不嚼者的8倍">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.pill{font-size:14px;font-weight:700;fill:#ffffff;}
.node{font-size:18px;font-weight:700;fill:#1e2030;}
.desc{font-size:13.5px;fill:#6e7276;}
.chip{font-size:13px;font-weight:700;}
.cap{font-size:14px;fill:#6e7276;}
.caphi{font-size:14px;font-weight:700;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">口腔黏膜病變的四階段進程</text>
<text x="58" y="90" class="deck">長期嚼食檳榔下，黏膜可能一步步惡化——愈早辨識，愈早介入</text>

<!-- ── 第一期：正常黏膜 ── -->
<rect x="40" y="132" width="185" height="248" rx="12" fill="#f6f7f9"/>
<rect x="40" y="132" width="185" height="4" rx="2" fill="#9aa0a6"/>
<rect x="100" y="150" width="65" height="26" rx="13" fill="#1f3a5f"/>
<text x="132.5" y="168" text-anchor="middle" class="pill">第一期</text>
<text x="132.5" y="212" text-anchor="middle" class="node">正常黏膜</text>
<text x="132.5" y="246" text-anchor="middle" class="desc">健康、有彈性</text>
<text x="132.5" y="268" text-anchor="middle" class="desc">表面光滑均勻</text>
<text x="132.5" y="290" text-anchor="middle" class="desc">無異常病灶</text>
<rect x="80" y="330" width="105" height="28" rx="14" fill="#eef0f3"/>
<text x="132.5" y="349" text-anchor="middle" class="chip" fill="#5e6070">風險：低</text>

<!-- 箭頭 1→2 -->
<g stroke="#a87515" fill="#a87515">
  <line x1="232" y1="256" x2="252" y2="256" stroke-width="3" stroke-linecap="round"/>
  <polygon points="252,250 260,256 252,262"/>
</g>

<!-- ── 第二期：纖維化與白斑 ── -->
<rect x="262" y="132" width="185" height="248" rx="12" fill="#f6f7f9"/>
<rect x="262" y="132" width="185" height="4" rx="2" fill="#a87515"/>
<rect x="322" y="150" width="65" height="26" rx="13" fill="#1f3a5f"/>
<text x="354.5" y="168" text-anchor="middle" class="pill">第二期</text>
<text x="354.5" y="212" text-anchor="middle" class="node">纖維化與白斑</text>
<text x="354.5" y="246" text-anchor="middle" class="desc">黏膜硬化、張口困難</text>
<text x="354.5" y="268" text-anchor="middle" class="desc">出現白色斑塊</text>
<text x="354.5" y="290" text-anchor="middle" class="desc">明確的癌前病變</text>
<rect x="290" y="330" width="129" height="28" rx="14" fill="#a87515"/>
<text x="354.5" y="349" text-anchor="middle" class="chip" fill="#ffffff">癌前病變</text>

<!-- 箭頭 2→3 -->
<g stroke="#a87515" fill="#a87515">
  <line x1="454" y1="256" x2="474" y2="256" stroke-width="3" stroke-linecap="round"/>
  <polygon points="474,250 482,256 474,262"/>
</g>

<!-- ── 第三期：上皮發育不良 ── -->
<rect x="484" y="132" width="185" height="248" rx="12" fill="#f6f7f9"/>
<rect x="484" y="132" width="185" height="4" rx="2" fill="#a87515"/>
<rect x="544" y="150" width="65" height="26" rx="13" fill="#1f3a5f"/>
<text x="576.5" y="168" text-anchor="middle" class="pill">第三期</text>
<text x="576.5" y="212" text-anchor="middle" class="node">上皮發育不良</text>
<text x="576.5" y="246" text-anchor="middle" class="desc">上皮細胞異常增生</text>
<text x="576.5" y="268" text-anchor="middle" class="desc">型態不規則</text>
<text x="576.5" y="290" text-anchor="middle" class="desc">惡化風險升高</text>
<rect x="504" y="330" width="145" height="28" rx="14" fill="#a87515"/>
<text x="576.5" y="349" text-anchor="middle" class="chip" fill="#ffffff">癌前病變・惡化中</text>

<!-- 箭頭 3→4 -->
<g stroke="#a12a2a" fill="#a12a2a">
  <line x1="676" y1="256" x2="696" y2="256" stroke-width="3" stroke-linecap="round"/>
  <polygon points="696,250 704,256 696,262"/>
</g>

<!-- ── 第四期：口腔鱗狀細胞癌（危險警示） ── -->
<rect x="706" y="132" width="185" height="248" rx="12" fill="#f7ecec"/>
<rect x="706" y="132" width="185" height="4" rx="2" fill="#a12a2a"/>
<rect x="766" y="150" width="65" height="26" rx="13" fill="#a12a2a"/>
<text x="798.5" y="168" text-anchor="middle" class="pill">第四期</text>
<!-- 警示三角形 -->
<path d="M798.5 194 L810 214 L787 214 Z" fill="none" stroke="#a12a2a" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="798.5" y1="201" x2="798.5" y2="208" stroke="#a12a2a" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="798.5" cy="211.5" r="1.4" fill="#a12a2a"/>
<text x="798.5" y="242" text-anchor="middle" class="node">口腔鱗狀細胞癌</text>
<text x="798.5" y="270" text-anchor="middle" class="desc">惡性腫瘤形成</text>
<text x="798.5" y="292" text-anchor="middle" class="desc">侵犯周邊組織</text>
<rect x="726" y="330" width="145" height="28" rx="14" fill="#a12a2a"/>
<text x="798.5" y="349" text-anchor="middle" class="chip" fill="#ffffff">惡性腫瘤</text>

<!-- 全程風險說明 -->
<text x="480" y="440" text-anchor="middle" class="cap">嚼食檳榔者罹患口腔癌的風險，約為不嚼食者的 <tspan class="caphi">8 倍</tspan>，且隨頻率與時間累積</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料來源：Warnakulasuriya &amp; Chen（2022）、Senevirathna 等（2023）</text>
</svg>
