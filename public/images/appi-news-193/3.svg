<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<defs><style>text{font-family:'Noto Sans TC','微軟正黑體',sans-serif;}</style></defs>
<rect width="960" height="600" fill="#fff"/>
<rect width="960" height="68" fill="#1B5E4B"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">口腔黏膜病變進程圖</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#C9A227">正常黏膜 → 黏膜下纖維化與白斑 → 上皮發育不良 → 口腔鱗狀細胞癌</text>

<rect x="50" y="85" width="178" height="360" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
