<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E4B">家中常被忽略的五大積水熱點</text>
  <text x="480" y="76" text-anchor="middle" font-size="16" fill="#6B7B77">定期清空這些角落，降低病媒蚊孳生風險</text>

  <!-- 卡片1：冷氣機集水盤 -->
