  <rect x="225" y="350" width="240" height="220" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="345" cy="425" r="44" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <circle cx="345" cy="425" r="30" fill="none" stroke="#1B5E4B" stroke-width="6"/>
