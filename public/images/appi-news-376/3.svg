  <circle cx="210" cy="175" r="44" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <rect x="180" y="152" width="60" height="26" rx="4" fill="none" stroke="#1B5E4B" stroke-width="5"/>
  <line x1="188" y1="188" x2="232" y2="188" stroke="#1B5E4B" stroke-width="5"/>
  <circle cx="210" cy="203" r="6" fill="#C9A227"/>
  <text x="210" y="255" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2A28">冷氣機集水盤</text>

