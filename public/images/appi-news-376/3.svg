  <!-- 卡片3：屋簷排水溝 -->
  <rect x="630" y="100" width="240" height="220" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="750" cy="175" r="44" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
