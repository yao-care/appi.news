<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="家中最常被漏查的五個積水熱點：冷氣機集水盤、花盆底盤、屋簷排水溝、廢棄輪胎、塑膠椅凹陷處，每一處都可能孳生病媒蚊">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.name{font-size:20px;font-weight:700;fill:#1e2030;}
.note{font-size:14px;fill:#6e7276;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">家中最常被漏查的積水熱點</text>
<text x="58" y="90" class="deck">這些死角不在日常清潔動線上，一場雨就能變成孑孓的育嬰房</text>

<!-- 列表分隔線 -->
<line x1="40" y1="208" x2="920" y2="208" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="284" x2="920" y2="284" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="360" x2="920" y2="360" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="436" x2="920" y2="436" stroke="#e8e9ed" stroke-width="1"/>

<!-- 1 冷氣機集水盤 -->
<circle cx="88" cy="170" r="26" fill="#eaf0f8"/>
<rect x="68" y="159" width="40" height="22" rx="3" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="74" y1="167" x2="102" y2="167" stroke="#1f3a5f" stroke-width="1.8"/>
<line x1="74" y1="173" x2="102" y2="173" stroke="#1f3a5f" stroke-width="1.8"/>
<circle cx="88" cy="190" r="3.2" fill="#a87515"/>
<text x="150" y="166" class="name">冷氣機集水盤</text>
<text x="150" y="188" class="note">藏在室外機底下，平常不會彎腰查看</text>

<!-- 2 花盆底盤 -->
<circle cx="88" cy="246" r="26" fill="#eaf0f8"/>
<path d="M74 236 L102 236 L97 250 L79 250 Z" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="88" cy="256" rx="20" ry="5" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
<ellipse cx="88" cy="256" rx="12" ry="2.6" fill="#a87515"/>
<text x="150" y="242" class="name">花盆底盤</text>
<text x="150" y="264" class="note">看似薄薄一層水，幾公分深斑蚊就夠用</text>

<!-- 3 屋簷排水溝 -->
<circle cx="88" cy="322" r="26" fill="#eaf0f8"/>
<path d="M70 320 L88 308 L106 320" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 328 Q88 340 104 328" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="88" cy="331" rx="9" ry="2.4" fill="#a87515"/>
<text x="150" y="318" class="name">屋簷排水溝</text>
<text x="150" y="340" class="note">落葉堆積、排水不良，形成局部積水</text>

<!-- 4 廢棄輪胎 -->
<circle cx="88" cy="398" r="26" fill="#eaf0f8"/>
<circle cx="88" cy="398" r="17" fill="none" stroke="#1f3a5f" stroke-width="3"/>
<circle cx="88" cy="398" r="7" fill="none" stroke="#1f3a5f" stroke-width="2"/>
<circle cx="88" cy="398" r="3" fill="#a87515"/>
<text x="150" y="394" class="name">廢棄輪胎</text>
<text x="150" y="416" class="note">胎紋容易存水，又不容易倒乾淨</text>

<!-- 5 塑膠椅凹陷處 -->
<circle cx="88" cy="474" r="26" fill="#eaf0f8"/>
<rect x="73" y="470" width="30" height="7" rx="2" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="73" y1="470" x2="73" y2="460" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="78" y1="477" x2="78" y2="486" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="98" y1="477" x2="98" y2="486" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="88" cy="472" rx="8" ry="2" fill="#a87515"/>
<text x="150" y="470" class="name">塑膠椅凹陷處</text>
<text x="150" y="492" class="note">太不起眼，幾乎不會被當成容器看待</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料來源：衛福部疾病管制署．巡倒清刷</text>
</svg>
