<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="個人防蚊的三道防線並列：淺色長袖衣物、紗窗紗門加細網、防蚊液，清除積水之外的三層物理與化學防護">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.badge{font-size:14px;font-weight:700;fill:#ffffff;}
.name{font-size:20px;font-weight:700;fill:#1e2030;}
.note{font-size:14px;fill:#6e7276;}
.warn{font-size:14px;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">個人防蚊的三道防線</text>
<text x="58" y="90" class="deck">清除積水是根本，這三層防護再把被叮咬的機會降到最低</text>

<!-- 欄位分隔線 -->
<line x1="333" y1="150" x2="333" y2="472" stroke="#e8e9ed" stroke-width="1"/>
<line x1="627" y1="150" x2="627" y2="472" stroke="#e8e9ed" stroke-width="1"/>

<!-- ── 第一道：淺色長袖衣物 ── -->
<g>
  <rect x="152" y="166" width="76" height="28" rx="14" fill="#1f3a5f"/>
  <text x="190" y="185" text-anchor="middle" class="badge">第一道</text>
  <circle cx="190" cy="272" r="34" fill="#eaf0f8"/>
  <path d="M177 253 L184 253 L190 261 L196 253 L203 253 L214 267 L204 275 L204 296 L176 296 L176 275 L166 267 Z" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="190" y="356" text-anchor="middle" class="name">淺色長袖衣物</text>
  <text x="190" y="386" text-anchor="middle" class="note">減少皮膚外露面積</text>
  <text x="190" y="408" text-anchor="middle" class="note">斑蚊白天活動，長袖最基本</text>
</g>

<!-- ── 第二道：紗窗紗門細網 ── -->
<g>
  <rect x="442" y="166" width="76" height="28" rx="14" fill="#1f3a5f"/>
  <text x="480" y="185" text-anchor="middle" class="badge">第二道</text>
  <circle cx="480" cy="272" r="34" fill="#eaf0f8"/>
  <rect x="458" y="250" width="44" height="44" rx="3" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
  <line x1="469" y1="250" x2="469" y2="294" stroke="#1f3a5f" stroke-width="1.3"/>
  <line x1="480" y1="250" x2="480" y2="294" stroke="#1f3a5f" stroke-width="1.3"/>
  <line x1="491" y1="250" x2="491" y2="294" stroke="#1f3a5f" stroke-width="1.3"/>
  <line x1="458" y1="261" x2="502" y2="261" stroke="#1f3a5f" stroke-width="1.3"/>
  <line x1="458" y1="272" x2="502" y2="272" stroke="#1f3a5f" stroke-width="1.3"/>
  <line x1="458" y1="283" x2="502" y2="283" stroke="#1f3a5f" stroke-width="1.3"/>
  <text x="480" y="356" text-anchor="middle" class="name">紗窗紗門細網</text>
  <text x="480" y="386" text-anchor="middle" class="note">阻絕蚊蟲進入室內</text>
  <text x="480" y="408" text-anchor="middle" class="note">確實關緊，破損處補上細網</text>
</g>

<!-- ── 第三道：防蚊液 ── -->
<g>
  <rect x="732" y="166" width="76" height="28" rx="14" fill="#1f3a5f"/>
  <text x="770" y="185" text-anchor="middle" class="badge">第三道</text>
  <circle cx="770" cy="272" r="34" fill="#eaf0f8"/>
  <rect x="757" y="262" width="26" height="34" rx="5" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
  <rect x="764" y="250" width="12" height="12" rx="2" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
  <line x1="752" y1="252" x2="742" y2="248" stroke="#a87515" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="752" y1="258" x2="740" y2="258" stroke="#a87515" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="752" y1="264" x2="742" y2="268" stroke="#a87515" stroke-width="2.5" stroke-linecap="round"/>
  <text x="770" y="356" text-anchor="middle" class="name">防蚊液</text>
  <text x="770" y="386" text-anchor="middle" class="note">DEET／派卡瑞丁／IR3535</text>
  <!-- 安全警示：形狀＋文字雙編碼 -->
  <path d="M700 400 L708 400 L704 393 Z" fill="#a12a2a"/>
  <line x1="704" y1="396" x2="704" y2="398" stroke="#ffffff" stroke-width="1"/>
  <text x="714" y="405" class="warn">2 個月以下嬰兒改用物理防護</text>
</g>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料來源：衛福部疾病管制署．防蚊篇</text>
</svg>
