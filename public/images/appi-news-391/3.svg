<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1B5E4B">季軍戰賽制對照</text>
  <text x="480" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6B7B77">五大賽事是否保留「殿軍之爭」（純類別對照，非排名）</text>

  <rect x="40" y="112" width="880" height="78" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="70" y="158" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B">世界盃足球賽</text>
  <circle cx="430" cy="151" r="22" fill="#C9A227"/>
  <text x="430" y="158" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1F2A28">有</text>
  <text x="480" y="158" font-family="sans-serif" font-size="15" fill="#6B7B77">自1954年起設有季軍戰，至今保留</text>

  <rect x="40" y="200" width="880" height="78" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="70" y="246" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B">歐洲國家盃</text>
  <circle cx="430" cy="239" r="22" fill="#6B7B77"/>
  <text x="430" y="246" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">無</text>
  <text x="480" y="246" font-family="sans-serif" font-size="15" fill="#6B7B77">1980年起廢止季軍戰</text>

  <rect x="40" y="288" width="880" height="78" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="70" y="334" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B">NBA 職業籃球聯盟</text>
  <circle cx="430" cy="327" r="22" fill="#6B7B77"/>
  <text x="430" y="334" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">無</text>
  <text x="480" y="334" font-family="sans-serif" font-size="15" fill="#6B7B77">賽制中未設季軍戰</text>

  <rect x="40" y="376" width="880" height="78" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="70" y="422" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B">NFL 美式足球聯盟</text>
  <circle cx="430" cy="415" r="22" fill="#6B7B77"/>
  <text x="430" y="422" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">無</text>
  <text x="480" y="422" font-family="sans-serif" font-size="15" fill="#6B7B77">賽制中未設季軍戰</text>

  <rect x="40" y="464" width="880" height="78" rx="10" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="70" y="510" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B5E4B">NCAA 大學籃球錦標賽</text>
  <circle cx="430" cy="503" r="22" fill="#6B7B77"/>
  <text x="430" y="510" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">無</text>
  <text x="480" y="510" font-family="sans-serif" font-size="15" fill="#6B7B77">賽制中未設季軍戰</text>

  <text x="480" y="576" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6B7B77">世界盃足球賽 ｜ 歐洲國家盃 ｜ NBA ｜ NFL ｜ NCAA 大學籃球錦標賽</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>