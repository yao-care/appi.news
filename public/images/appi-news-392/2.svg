.stance{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:18px;font-weight:700;fill:#D1482A;}
.desc{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:13px;fill:#6B7280;}
.abbr{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:17px;font-weight:700;fill:#FFFFFF;}
