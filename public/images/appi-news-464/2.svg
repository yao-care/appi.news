<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1B5E4B">全國中等學校桌球錦標賽 團體組冠軍一覽</text>
  <line x1="80" y1="80" x2="880" y2="80" stroke="#C9A227" stroke-width="3"/>

  <!-- 高中男生組 -->
  <g>
    <rect x="70" y="130" width="380" height="190" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
    <rect x="70" y="130" width="380" height="46" rx="16" fill="#1B5E4B"/>
    <rect x="70" y="160" width="380" height="16" fill="#1B5E4B"/>
    <text x="260" y="160" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">高中男生團體組</text>
    <text x="260" y="215" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6B7B77">冠軍學校</text>
    <text x="260" y="260" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#C9A227">第一銀行高中</text>
    <circle cx="260" cy="295" r="6" fill="#2E8B6F"/>
  </g>

  <!-- 高中女生組 -->
  <g>
    <rect x="510" y="130" width="380" height="190" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
    <rect x="510" y="130" width="380" height="46" rx="16" fill="#1B5E4B"/>
