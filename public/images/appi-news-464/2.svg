    <text x="260" y="435" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6B7B77">冠軍學校</text>
    <text x="260" y="480" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#C9A227">介壽國中</text>
    <circle cx="260" cy="515" r="6" fill="#1B5E4B"/>
  </g>

  <!-- 國中女生組 -->
  <g>
    <rect x="510" y="350" width="380" height="190" rx="16" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
    <rect x="510" y="350" width="380" height="46" rx="16" fill="#2E8B6F"/>
