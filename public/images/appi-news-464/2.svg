    <text x="700" y="435" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6B7B77">冠軍學校</text>
    <text x="700" y="480" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#C9A227">深坑國中</text>
