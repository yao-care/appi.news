    <text x="700" y="215" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6B7B77">冠軍學校</text>
    <text x="700" y="260" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#C9A227">臺南桌委高中</text>
    <circle cx="700" cy="295" r="6" fill="#2E8B6F"/>
  </g>

  <!-- 國中男生組 -->
  <g>
    <rect x="70" y="350" width="380" height="190" rx="16" fill="#F2F7F5" stroke="#2E8B6F" stroke-width="2"/>
    <rect x="70" y="350" width="380" height="46" rx="16" fill="#2E8B6F"/>
