<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="55" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E4B">黑箱AI 與 可解釋AI 決策方式比較</text>

  <rect x="40" y="100" width="420" height="460" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="250" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#1B5E4B">黑箱AI</text>

  <circle cx="110" cy="380" r="34" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <text x="110" y="388" text-anchor="middle" font-size="16" fill="#1F2A28">輸入</text>

  <line x1="146" y1="380" x2="195" y2="380" stroke="#6B7B77" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="200" y="320" width="100" height="120" rx="10" fill="#1B5E4B"/>
  <text x="250" y="392" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">?</text>

  <line x1="305" y1="380" x2="354" y2="380" stroke="#6B7B77" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="390" cy="380" r="34" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <text x="390" y="388" text-anchor="middle" font-size="16" fill="#1F2A28">輸出</text>

  <text x="250" y="500" text-anchor="middle" font-size="16" fill="#6B7B77">判斷過程不透明，無法追溯</text>

  <rect x="500" y="100" width="420" height="460" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="710" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#1B5E4B">可解釋AI</text>

  <circle cx="560" cy="380" r="34" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <text x="560" y="388" text-anchor="middle" font-size="16" fill="#1F2A28">輸入</text>

  <line x1="596" y1="380" x2="635" y2="380" stroke="#6B7B77" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="320" width="140" height="120" rx="10" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
  <circle cx="665" cy="350" r="8" fill="#2E8B6F"/>
  <circle cx="710" cy="380" r="8" fill="#2E8B6F"/>
  <circle cx="755" cy="350" r="8" fill="#2E8B6F"/>
  <circle cx="710" cy="410" r="8" fill="#2E8B6F"/>
  <line x1="665" y1="350" x2="710" y2="380" stroke="#C9A227" stroke-width="2"/>
  <line x1="710" y1="380" x2="755" y2="350" stroke="#C9A227" stroke-width="2"/>
  <line x1="665" y1="350" x2="710" y2="410" stroke="#C9A227" stroke-width="2"/>
  <line x1="710" y1="410" x2="755" y2="350" stroke="#C9A227" stroke-width="2"/>

  <line x1="785" y1="380" x2="824" y2="380" stroke="#6B7B77" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="860" cy="380" r="34" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="3"/>
  <text x="860" y="388" text-anchor="middle" font-size="16" fill="#1F2A28">輸出</text>

  <text x="710" y="500" text-anchor="middle" font-size="16" fill="#6B7B77">推理步驟可見，結果可追溯</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B7B77"/>
    </marker>
  </defs>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>