<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E4B">台灣男雙世界桌球錦標賽獎牌時間軸</text>
  <text x="480" y="90" text-anchor="middle" font-size="15" fill="#6B7B77">2001－2025 四座獨立獎牌紀錄</text>

  <line x1="100" y1="330" x2="860" y2="330" stroke="#2E8B6F" stroke-width="4"/>

  <!-- 2001 bronze (above) -->
  <rect x="90" y="150" width="190" height="120" rx="10" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="185" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1B5E4B">2001年　銅牌</text>
  <text x="185" y="210" text-anchor="middle" font-size="15" fill="#1F2A28">江彭龍</text>
  <text x="185" y="232" text-anchor="middle" font-size="15" fill="#1F2A28">張硯鈞</text>
  <line x1="185" y1="270" x2="185" y2="322" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="185" cy="330" r="16" fill="#B08D57" stroke="#1B5E4B" stroke-width="2"/>
  <text x="185" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">銅</text>

  <!-- 2007 bronze (below) -->
  <line x1="365" y1="338" x2="365" y2="380" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="365" cy="330" r="16" fill="#B08D57" stroke="#1B5E4B" stroke-width="2"/>
  <text x="365" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">銅</text>
  <rect x="270" y="380" width="190" height="120" rx="10" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="365" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#1B5E4B">2007年　銅牌</text>
  <text x="365" y="440" text-anchor="middle" font-size="15" fill="#1F2A28">江彭龍</text>
  <text x="365" y="462" text-anchor="middle" font-size="15" fill="#1F2A28">張硯鈞</text>

  <!-- 2013 gold (above) -->
  <rect x="450" y="150" width="200" height="120" rx="10" fill="#F2F7F5" stroke="#C9A227" stroke-width="3"/>
  <text x="550" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1B5E4B">2013年　金牌</text>
  <text x="550" y="210" text-anchor="middle" font-size="15" fill="#1F2A28">莊智淵</text>
  <text x="550" y="232" text-anchor="middle" font-size="15" fill="#1F2A28">陳建安</text>
  <line x1="550" y1="270" x2="550" y2="322" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="550" cy="330" r="18" fill="#C9A227" stroke="#1B5E4B" stroke-width="2"/>
  <text x="550" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2A28">金</text>

  <!-- 2025 silver (below) -->
  <line x1="750" y1="338" x2="750" y2="380" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="750" cy="330" r="16" fill="#B9C2C0" stroke="#1B5E4B" stroke-width="2"/>
  <text x="750" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2A28">銀</text>
  <rect x="650" y="380" width="200" height="120" rx="10" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="750" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#1B5E4B">2025年　銀牌</text>
  <text x="750" y="440" text-anchor="middle" font-size="15" fill="#1F2A28">林昀儒</text>
  <text x="750" y="462" text-anchor="middle" font-size="15" fill="#1F2A28">高承睿</text>

  <text x="480" y="560" text-anchor="middle" font-size="13" fill="#6B7B77">四屆獎牌各為獨立賽事成績，非連續累積</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>