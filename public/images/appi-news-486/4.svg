<text x="112" y="350" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12.5" fill="#6B7B77"><tspan x="112" dy="0">掌握長者跌倒</tspan><tspan x="112" dy="18">風險等級</tspan></text>

