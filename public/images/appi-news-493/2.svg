<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <style>
    text { font-family: "Noto Sans CJK TC", "Noto Sans TC", sans-serif; }
  </style>
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#1B5E4B">高齡安眠藥用藥監測：三項並列檢核條件</text>

  <!-- Panel 1：年齡 -->
  <rect x="60" y="150" width="240" height="370" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="180" cy="230" r="50" fill="#2E8B6F"/>
  <text x="180" y="240" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">65+</text>
  <text x="180" y="330" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B5E4B">年齡65歲以上</text>
  <text x="180" y="360" text-anchor="middle" font-size="16" fill="#6B7B77">屬高齡族群</text>

  <text x="330" y="245" text-anchor="middle" font-size="40" font-weight="bold" fill="#C9A227">＋</text>

  <!-- Panel 2：藥物種類 -->
  <rect x="360" y="150" width="240" height="370" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="480" cy="230" r="50" fill="#2E8B6F"/>
  <rect x="465" y="196" width="30" height="12" rx="6" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5" transform="rotate(-30 480 202)"/>
  <rect x="465" y="224" width="30" height="12" rx="6" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5" transform="rotate(0 480 230)"/>
  <rect x="465" y="252" width="30" height="12" rx="6" fill="#FFFFFF" stroke="#C9A227" stroke-width="1.5" transform="rotate(30 480 258)"/>
  <text x="480" y="322" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B5E4B">同時使用3種以上</text>
  <text x="480" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B5E4B">安眠藥</text>
  <text x="480" y="378" text-anchor="middle" font-size="16" fill="#6B7B77">多重藥物合併使用</text>

  <text x="630" y="245" text-anchor="middle" font-size="40" font-weight="bold" fill="#C9A227">＋</text>

  <!-- Panel 3：累積用藥期間 -->
  <rect x="660" y="150" width="240" height="370" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <circle cx="780" cy="230" r="50" fill="#2E8B6F"/>
  <rect x="745" y="195" width="70" height="60" rx="4" fill="#FFFFFF" stroke="#1B5E4B" stroke-width="1.5"/>
  <rect x="745" y="195" width="70" height="14" rx="4" fill="#C9A227"/>
  <rect x="746" y="211" width="16" height="13" fill="#C9A227"/>
  <rect x="764" y="211" width="16" height="13" fill="#C9A227"/>
  <rect x="782" y="211" width="16" height="13" fill="#C9A227"/>
  <rect x="800" y="211" width="14" height="13" fill="#C9A227"/>
  <rect x="746" y="226" width="16" height="13" fill="#C9A227"/>
  <rect x="764" y="226" width="16" height="13" fill="#C9A227"/>
  <rect x="782" y="226" width="16" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <rect x="800" y="226" width="14" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <rect x="746" y="241" width="16" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <rect x="764" y="241" width="16" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <rect x="782" y="241" width="16" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <rect x="800" y="241" width="14" height="13" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1"/>
  <text x="780" y="322" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B5E4B">一年內累積用藥</text>
  <text x="780" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#1B5E4B">逾6個月</text>
  <text x="780" y="378" text-anchor="middle" font-size="16" fill="#6B7B77">長期持續使用</text>

  <text x="480" y="555" text-anchor="middle" font-size="16" fill="#6B7B77">三項條件並列成立，即列入監測範圍（無先後順序之分）</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>