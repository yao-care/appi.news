<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-label="兩種健康資料開放模式責任歸屬對照：ChatGPT Health 由 OpenAI 自建連結，健康存摺SDK 由衛福部健保署認證介接，五項比較各有不同做法">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.badge{font-size:15px;font-weight:700;fill:#ffffff;}
.colhead{font-size:18px;font-weight:700;fill:#1e2030;}
.tablehead{font-size:15px;font-weight:700;fill:#6e7276;}
.rowlabel{font-size:15px;font-weight:700;fill:#1e2030;}
.val{font-size:14px;fill:#1e2030;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="680" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">兩種健康資料開放模式的責任歸屬對照</text>
<text x="58" y="90" class="deck">ChatGPT Health 自建連結 vs 台灣健保健康存摺SDK 認證介接</text>

<!-- 欄位徽章 -->
<rect x="335" y="108" width="110" height="28" rx="14" fill="#1f3a5f"/>
<text x="390" y="127" text-anchor="middle" class="badge">OpenAI</text>
<rect x="670" y="108" width="160" height="28" rx="14" fill="#1f3a5f"/>
<text x="750" y="127" text-anchor="middle" class="badge">衛福部／健保署</text>

<!-- 欄位標題 -->
<text x="56" y="152" class="tablehead">比較項目</text>
<text x="390" y="152" text-anchor="middle" class="colhead">ChatGPT Health（自建連結）</text>
<text x="750" y="152" text-anchor="middle" class="colhead">健康存摺SDK（認證介接）</text>

<!-- 表頭分隔線 -->
<line x1="40" y1="170" x2="920" y2="170" stroke="#e8e9ed" stroke-width="1"/>
<!-- 直向分隔線 -->
<line x1="210" y1="170" x2="210" y2="610" stroke="#e8e9ed" stroke-width="1"/>
<line x1="570" y1="170" x2="570" y2="610" stroke="#e8e9ed" stroke-width="1"/>
<!-- 橫向列分隔線 -->
<line x1="40" y1="258" x2="920" y2="258" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="346" x2="920" y2="346" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="434" x2="920" y2="434" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="522" x2="920" y2="522" stroke="#e8e9ed" stroke-width="1"/>
<line x1="40" y1="610" x2="920" y2="610" stroke="#e8e9ed" stroke-width="1"/>

<!-- Row 1：資料連結方式 -->
<text x="56" y="219" class="rowlabel">資料連結方式</text>
<text x="390" y="208" text-anchor="middle" class="val">自建連結／病歷＋</text>
<text x="390" y="230" text-anchor="middle" class="val">穿戴裝置＋健康App</text>
<text x="750" y="208" text-anchor="middle" class="val">第三方App／逐次</text>
<text x="750" y="230" text-anchor="middle" class="val">期間授權存摺資料</text>

<!-- Row 2：介接規模 -->
<text x="56" y="307" class="rowlabel">介接規模</text>
<text x="390" y="296" text-anchor="middle" class="val">美國起步／iOS＋</text>
<text x="390" y="318" text-anchor="middle" class="val">網頁陸續擴大</text>
<text x="750" y="296" text-anchor="middle" class="val">31家單位／64款</text>
<text x="750" y="318" text-anchor="middle" class="val">App完成介接上架</text>

<!-- Row 3：資安把關 -->
<text x="56" y="395" class="rowlabel">資安把關</text>
<text x="390" y="384" text-anchor="middle" class="val">OpenAI內部審核</text>
<text x="390" y="406" text-anchor="middle" class="val">對話不進模型訓練</text>
<text x="750" y="384" text-anchor="middle" class="val">數位部APP資安L2</text>
<text x="750" y="406" text-anchor="middle" class="val">以上證明／每年更新</text>

<!-- Row 4：誰能介接 -->
<text x="56" y="483" class="rowlabel">誰能介接</text>
<text x="390" y="472" text-anchor="middle" class="val">OpenAI自行認定</text>
<text x="390" y="494" text-anchor="middle" class="val">合作App範圍</text>
<text x="750" y="472" text-anchor="middle" class="val">限本國機構／</text>
<text x="750" y="494" text-anchor="middle" class="val">排除陸資企業</text>

<!-- Row 5：出錯找誰負責 -->
<text x="56" y="571" class="rowlabel">出錯找誰負責</text>
<text x="390" y="560" text-anchor="middle" class="val">單一公司內部負責</text>
<text x="390" y="582" text-anchor="middle" class="val">跨境監理機制未定</text>
<text x="750" y="560" text-anchor="middle" class="val">各業者對外負責</text>
<text x="750" y="582" text-anchor="middle" class="val">衛福部／健保署可撤照</text>

<!-- 頁尾 -->
<text x="40" y="642" class="foot">製圖：APPI News</text>
<text x="920" y="642" text-anchor="end" class="foot">資料時點：2026-01 OpenAI 公告／衛福部健康存摺SDK頁面</text>
</svg>
