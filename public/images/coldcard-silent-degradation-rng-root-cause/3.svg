<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1B5E4B">常態路徑 vs. 降級路徑：測試覆蓋率的落差</text>
  <text x="480" y="82" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6B7B77">兩條並行路徑，測試投入量差距極大</text>

  <rect x="60" y="120" width="380" height="400" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="250" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1B5E4B">常態路徑</text>
  <text x="250" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6B7B77">每日大量流量經過</text>

  <line x1="110" y1="230" x2="390" y2="230" stroke="#2E8B6F" stroke-width="6"/>
  <circle cx="110" cy="230" r="10" fill="#1B5E4B"/>
  <circle cx="250" cy="230" r="10" fill="#1B5E4B"/>
  <circle cx="390" cy="230" r="10" fill="#1B5E4B"/>

  <rect x="90" y="270" width="320" height="210" rx="10" fill="#FFFFFF" stroke="#2E8B6F" stroke-width="1.5"/>
  <text x="250" y="298" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1B5E4B">測試覆蓋標記</text>
  <g font-family="sans-serif" font-size="15" fill="#1F2A28">
    <circle cx="120" cy="325" r="9" fill="#C9A227"/><text x="120" y="330" text-anchor="middle" fill="#FFFFFF" font-size="12">✓</text>
    <text x="140" y="331">單元測試齊全</text>
    <circle cx="120" cy="360" r="9" fill="#C9A227"/><text x="120" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12">✓</text>
    <text x="140" y="366">整合測試涵蓋</text>
    <circle cx="120" cy="395" r="9" fill="#C9A227"/><text x="120" y="400" text-anchor="middle" fill="#FFFFFF" font-size="12">✓</text>
    <text x="140" y="401">QA 人工驗證</text>
    <circle cx="120" cy="430" r="9" fill="#C9A227"/><text x="120" y="435" text-anchor="middle" fill="#FFFFFF" font-size="12">✓</text>
    <text x="140" y="436">程式碼審查重點</text>
  </g>
  <text x="250" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6B7B77">高曝光 → 高覆蓋</text>

  <rect x="520" y="120" width="380" height="400" rx="16" fill="#F2F7F5" stroke="#1B5E4B" stroke-width="2"/>
  <text x="710" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1B5E4B">極少觸發的降級路徑</text>
  <text x="710" y="184" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6B7B77">僅在罕見情況才會執行</text>

  <line x1="570" y1="230" x2="850" y2="230" stroke="#6B7B77" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="570" cy="230" r="10" fill="#6B7B77"/>
  <circle cx="710" cy="230" r="10" fill="#6B7B77"/>
  <circle cx="850" cy="230" r="10" fill="#6B7B77"/>

  <rect x="550" y="270" width="320" height="210" rx="10" fill="#FFFFFF" stroke="#6B7B77" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="710" y="298" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1B5E4B">測試覆蓋標記</text>
  <g font-family="sans-serif" font-size="15" fill="#1F2A28">
    <circle cx="580" cy="325" r="9" fill="#FFFFFF" stroke="#6B7B77" stroke-width="1.5"/>
    <text x="600" y="331">單元測試缺漏</text>
    <circle cx="580" cy="360" r="9" fill="#FFFFFF" stroke="#6B7B77" stroke-width="1.5"/>
    <text x="600" y="366">整合測試未涵蓋</text>
    <circle cx="580" cy="395" r="9" fill="#FFFFFF" stroke="#6B7B77" stroke-width="1.5"/>
    <text x="600" y="401">QA 未曾驗證</text>
    <circle cx="580" cy="430" r="9" fill="#FFFFFF" stroke="#6B7B77" stroke-width="1.5"/>
    <text x="600" y="436">審查時被略過</text>
  </g>
  <text x="710" y="500" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6B7B77">低曝光 → 低覆蓋</text>

  <text x="480" y="560" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1F2A28">兩條路徑並行存在，罕見路徑因少被執行而長期未被測試與審查發現</text>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>