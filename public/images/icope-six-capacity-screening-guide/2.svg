<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">六項日常功能訊號</title>
  <desc id="desc">六個並列圖卡分別呈現認知、行動、營養、視力、聽力與情緒的日常功能訊號</desc>
  <style>
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#1F2A28}
    .card{fill:#F2F7F5;stroke:#1B5E4B;stroke-width:2}
    .icon{fill:none;stroke:#2E8B6F;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .name{font-size:25px;font-weight:700;fill:#1B5E4B}
    .note{font-size:17px;font-weight:500;fill:#1F2A28}
    .gold{fill:#C9A227;stroke:none}
  </style>
  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="46" text-anchor="middle" font-size="32" font-weight="700" fill="#1B5E4B">六項日常功能訊號</text>
  <text x="480" y="76" text-anchor="middle" font-size="17" fill="#6B7B77">從社區生活觀察長輩的日常變化</text>

  <g aria-label="認知">
    <rect class="card" x="45" y="105" width="270" height="205" rx="18"/>
    <rect class="icon" x="75" y="135" width="55" height="65" rx="6"/>
    <line class="icon" x1="87" y1="151" x2="118" y2="151"/>
    <circle class="gold" cx="89" cy="168" r="4"/><line class="icon" x1="101" y1="168" x2="118" y2="168"/>
    <circle class="gold" cx="89" cy="185" r="4"/><line class="icon" x1="101" y1="185" x2="118" y2="185"/>
    <path class="icon" d="M151 194v-29l20-16 20 16v29h-40"/>
    <circle class="gold" cx="171" cy="175" r="5"/>
    <text class="name" x="210" y="156">認知</text>
    <text class="note" x="75" y="235">記得服藥與約定</text>
    <text class="note" x="75" y="265">知道時間與所在位置</text>
  </g>

  <g aria-label="行動">
    <rect class="card" x="345" y="105" width="270" height="205" rx="18"/>
    <circle class="icon" cx="413" cy="151" r="13"/>
    <path class="icon" d="M413 165v35m0-23-22 15m22-15 24 8m-24 15-18 25m18-25 24 24"/>
    <line class="icon" x1="380" y1="230" x2="460" y2="230"/>
    <circle class="gold" cx="463" cy="230" r="5"/>
    <text class="name" x="510" y="156">行動</text>
    <text class="note" x="375" y="255">能否自行站起</text>
    <text class="note" x="375" y="283">走路是否穩定</text>
  </g>

  <g aria-label="營養">
    <rect class="card" x="645" y="105" width="270" height="205" rx="18"/>
    <path class="icon" d="M678 165h76c-4 29-20 42-38 42s-34-13-38-42"/>
    <line class="icon" x1="688" y1="211" x2="744" y2="211"/>
    <path class="icon" d="M781 145h54v61h-54z M792 162q16-13 32 0"/>
    <line class="icon" x1="808" y1="162" x2="817" y2="174"/>
    <circle class="gold" cx="808" cy="162" r="5"/>
    <text class="name" x="780" y="245">營養</text>
    <text class="note" x="675" y="274">食慾與非刻意的體重變化</text>
  </g>

  <g aria-label="視力">
    <rect class="card" x="45" y="340" width="270" height="205" rx="18"/>
    <path class="icon" d="M75 382q28-17 56 0v55q-28-17-56 0z M131 382q28-17 56 0v55q-28-17-56 0z"/>
    <line class="icon" x1="131" y1="382" x2="131" y2="437"/>
    <path class="icon" d="M210 430l20-48 20 48m-31-22h22"/>
    <circle class="gold" cx="230" cy="382" r="6"/>
    <text class="name" x="230" y="470">視力</text>
    <text class="note" x="75" y="502">看清文字，安全辨路</text>
  </g>

  <g aria-label="聽力">
    <rect class="card" x="345" y="340" width="270" height="205" rx="18"/>
    <path class="icon" d="M380 382h73v45h-38l-17 14v-14h-18z"/>
    <circle class="gold" cx="397" cy="404" r="4"/><circle class="gold" cx="416" cy="404" r="4"/><circle class="gold" cx="435" cy="404" r="4"/>
    <path class="icon" d="M485 389c12-17 41-8 41 14 0 24-26 20-26 43 0 8-5 13-13 13"/>
    <path class="icon" d="M495 405c2-9 17-10 19 0 2 9-9 10-11 18"/>
    <text class="name" x="535" y="398">聽力</text>
    <text class="note" x="375" y="493">能否跟上日常對話</text>
  </g>

  <g aria-label="情緒">
    <rect class="card" x="645" y="340" width="270" height="205" rx="18"/>
    <circle class="icon" cx="716" cy="407" r="39"/>
    <circle class="gold" cx="702" cy="399" r="4"/><circle class="gold" cx="730" cy="399" r="4"/>
    <path class="icon" d="M700 429q16-15 32 0"/>
    <path class="icon" d="M785 385c16-18 42 5 0 36-42-31-16-54 0-36z"/>
    <text class="name" x="792" y="456">情緒</text>
    <text class="note" x="675" y="493">持續難過或失去興趣</text>
  </g>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>