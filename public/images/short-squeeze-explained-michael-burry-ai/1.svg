<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="軋空三步驟：空頭融券借股票賣出，股價不跌反漲導致帳面虧損擴大，觸發保證金追繳或到期強制回補，空頭被迫買回股票，買盤又進一步推升股價，形成連鎖上漲">
<style>
text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC','Heiti TC',sans-serif;}
.title{font-size:26px;font-weight:700;fill:#1e2030;}
.deck{font-size:15px;fill:#6e7276;}
.badge{font-size:16px;font-weight:700;fill:#ffffff;}
.stage{font-size:19px;font-weight:700;fill:#1e2030;}
.item{font-size:14px;fill:#1e2030;}
.arrowlabel{font-size:14px;font-weight:700;fill:#a87515;}
.risklabel{font-size:13.5px;fill:#a12a2a;}
.foot{font-size:13px;fill:#6e7276;}
</style>
<rect width="960" height="600" fill="#ffffff"/>

<!-- 標題列 -->
<rect x="40" y="38" width="4" height="28" rx="2" fill="#a87515"/>
<text x="58" y="60" class="title">軋空是怎麼發生的</text>
<text x="58" y="90" class="deck">空頭被迫買回股票的那一刻，買盤本身又會把股價再往上推</text>

<!-- 三個階段方塊 -->
<rect x="40" y="140" width="255" height="300" rx="12" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="2"/>
<rect x="352" y="140" width="255" height="300" rx="12" fill="#eaf0f8" stroke="#1f3a5f" stroke-width="2"/>
<rect x="378" y="140" width="203" height="3" rx="1.5" fill="#a87515"/>
<rect x="664" y="140" width="255" height="300" rx="12" fill="#f4f4f4" stroke="#1f3a5f" stroke-width="2"/>

<!-- 階段一：放空進場 -->
<rect x="70" y="164" width="100" height="30" rx="15" fill="#1f3a5f"/>
<text x="120" y="184" text-anchor="middle" class="badge">第一步</text>
<text x="167" y="232" text-anchor="middle" class="stage">融券放空</text>
<text x="167" y="272" text-anchor="middle" class="item">跟券商借股票先賣出</text>
<text x="167" y="298" text-anchor="middle" class="item">預期股價會下跌</text>
<text x="167" y="324" text-anchor="middle" class="item">計畫低價買回、賺價差</text>
<text x="167" y="350" text-anchor="middle" class="item">歸還借來的股票</text>
<text x="167" y="400" text-anchor="middle" class="item">理論上下跌空間有限</text>
<text x="167" y="422" text-anchor="middle" class="item">上漲虧損卻沒有上限</text>

<!-- 階段二：股價反漲 -->
<rect x="382" y="164" width="140" height="30" rx="15" fill="#1f3a5f"/>
<text x="452" y="184" text-anchor="middle" class="badge">第二步</text>
<text x="479" y="232" text-anchor="middle" class="stage">股價不跌反漲</text>
<text x="479" y="272" text-anchor="middle" class="item">財報優於預期、利多消息</text>
<text x="479" y="298" text-anchor="middle" class="item">或市場買盤持續湧入</text>
<text x="479" y="332" text-anchor="middle" class="stage" fill="#a87515">空頭帳面虧損擴大</text>
<text x="479" y="368" text-anchor="middle" class="item">虧損隨股價上漲累積</text>
<text x="479" y="394" text-anchor="middle" class="item">保證金維持率</text>
<text x="479" y="420" text-anchor="middle" class="item">逐漸逼近下限</text>

<!-- 階段三：被迫回補 -->
<rect x="694" y="164" width="120" height="30" rx="15" fill="#1f3a5f"/>
<text x="754" y="184" text-anchor="middle" class="badge">第三步</text>
<text x="791" y="232" text-anchor="middle" class="stage">被迫回補</text>
<text x="791" y="272" text-anchor="middle" class="item">券商發出追繳通知</text>
<text x="791" y="298" text-anchor="middle" class="item">或碰上強制回補期限</text>
<text x="791" y="324" text-anchor="middle" class="item">空頭不計價買回股票</text>
<text x="791" y="360" text-anchor="middle" class="item">還給券商了結部位</text>
<text x="791" y="386" text-anchor="middle" class="item">認賠出場</text>
<text x="791" y="408" text-anchor="middle" class="item">沒有猶豫空間</text>

<!-- 正向箭頭 -->
<line x1="297" y1="230" x2="348" y2="230" stroke="#a87515" stroke-width="4" stroke-linecap="round"/>
<polygon points="348,230 336,224 336,236" fill="#a87515"/>
<text x="322" y="216" text-anchor="middle" class="arrowlabel">股價走勢</text>

<line x1="609" y1="230" x2="660" y2="230" stroke="#a87515" stroke-width="4" stroke-linecap="round"/>
<polygon points="660,230 648,224 648,236" fill="#a87515"/>
<text x="634" y="216" text-anchor="middle" class="arrowlabel">壓力累積</text>

<!-- 回補買盤推升股價（底部反向回到第二步） -->
<line x1="660" y1="470" x2="609" y2="470" stroke="#a12a2a" stroke-width="3" stroke-linecap="round"/>
<polygon points="609,470 621,464 621,476" fill="#a12a2a"/>
<line x1="609" y1="470" x2="348" y2="470" stroke="#a12a2a" stroke-width="3"/>
<text x="479" y="494" text-anchor="middle" class="risklabel">回補本身就是買進，買盤又把股價再推高，形成連鎖上漲</text>

<!-- 頁尾 -->
<line x1="40" y1="526" x2="920" y2="526" stroke="#e8e9ed" stroke-width="1"/>
<text x="40" y="556" class="foot">製圖：APPI News</text>
<text x="920" y="556" text-anchor="end" class="foot">資料時點：2026年8月・一般融券放空與軋空機制整理</text>
</svg>
