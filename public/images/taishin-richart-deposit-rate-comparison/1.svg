<text x="216" y="472" class="rate">2.2%</text>
<text x="336" y="472" class="term">13個月</text>
<text x="436" y="464" class="limit">限本行活存客戶</text>
<text x="436" y="484" class="limit">單筆300萬・10筆上限</text>

<text x="56" y="542" class="bank">匯豐銀行</text>
<text x="216" y="542" class="rate">2.2%~3.0%</text>
<text x="336" y="542" class="term">3~6個月</text>
<text x="436" y="534" class="limit">限卓越理財客戶</text>
<text x="436" y="554" class="limit">限額1,500萬~3,000萬</text>

