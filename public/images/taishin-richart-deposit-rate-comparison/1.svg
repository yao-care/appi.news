<text x="216" y="332" class="rate">2.2%</text>
<text x="336" y="332" class="term">12個月</text>
<text x="436" y="324" class="limit">新資金・50筆上限</text>
<text x="436" y="344" class="limit">累計上限3,000萬</text>

<text x="56" y="402" class="bank">樂天銀行</text>
<text x="216" y="402" class="rate">2.2%</text>
<text x="336" y="402" class="term">12個月</text>
<text x="436" y="394" class="limit">新資金・單筆上限300萬</text>
<text x="436" y="414" class="limit">不限承作筆數</text>

