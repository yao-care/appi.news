<text x="56" y="192" class="bank">台新Richart</text>
<text x="216" y="192" class="rate">2.2%</text>
<text x="336" y="192" class="term">6個月</text>
<text x="436" y="184" class="limit">新資金・可多筆承作</text>
<text x="436" y="204" class="limit">單筆1萬~200萬・全案上限200筆</text>

<text x="56" y="262" class="bank">王道銀行</text>
<text x="216" y="262" class="rate">2.35%</text>
<text x="336" y="262" class="term">9個月</text>
<text x="436" y="254" class="limit">新資金・單筆2萬~1,000萬</text>
<text x="436" y="274" class="limit">99筆上限</text>

