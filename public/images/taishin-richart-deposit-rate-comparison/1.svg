<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="表格比較六家銀行2026年8月高利定存促案：台新Richart年利率2.2%、天期6個月；王道銀行2.35%、9個月；將來銀行2.2%、12個月；樂天銀行2.2%、12個月；LINE Bank 2.2%、13個月；匯豐銀行2.2%至3.0%、3至6個月，各自有新資金、筆數或客群等限制">
