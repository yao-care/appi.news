<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="台股AI榮景檢查表，列出本益比、科技市值集中、台積電市值權重與台積電高效能運算營收占比四項數字">
