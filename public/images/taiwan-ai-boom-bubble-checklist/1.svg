  <text x="40" y="548" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="13" fill="#6e7276">來源：FSM Global、TWSE、Al Jazeera、台積電 2026 年第 2 季法說資料</text>
