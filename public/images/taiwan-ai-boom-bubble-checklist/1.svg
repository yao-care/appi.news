  <text x="58" y="84" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="15" fill="#6e7276">單一數字不能判定泡沫，估值、集中度與獲利來源要一起核對。</text>

  <line x1="40" y1="112" x2="920" y2="112" stroke="#e8e9ed"/>
  <rect x="40" y="113" width="880" height="42" fill="#eaf0f8"/>
