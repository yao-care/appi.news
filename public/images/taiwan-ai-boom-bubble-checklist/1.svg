    <text x="800" y="190" font-size="14" fill="#6e7276">FSM Global</text>
    <line x1="40" y1="227" x2="920" y2="227" stroke="#e8e9ed"/>

    <rect x="40" y="228" width="880" height="72" rx="8" fill="#eaf0f8"/>
    <rect x="40" y="228" width="880" height="3" fill="#a87515"/>
    <text x="58" y="258" font-size="18" font-weight="700">科技相關市值</text>
    <text x="285" y="258" font-size="22" font-weight="700" fill="#a87515">81.44%</text>
    <text x="470" y="253" font-size="14">TWSE 上市公司市值</text>
    <text x="470" y="274" font-size="14">集中於科技相關產業</text>
    <text x="800" y="263" font-size="14" fill="#6e7276">TWSE</text>
    <line x1="40" y1="300" x2="920" y2="300" stroke="#e8e9ed"/>

    <text x="58" y="330" font-size="18" font-weight="700">台積電市值權重</text>
    <text x="285" y="330" font-size="22" font-weight="700" fill="#a87515">約 40%</text>
    <text x="470" y="325" font-size="14">單一公司波動</text>
    <text x="470" y="346" font-size="14">會放大指數起伏</text>
