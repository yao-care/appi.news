  <text x="470" y="140" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#1e2030">讀法</text>
  <text x="800" y="140" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#1e2030">來源</text>

  <g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#1e2030">
    <line x1="40" y1="155" x2="920" y2="155" stroke="#e8e9ed"/>
