    <text x="660" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#2E8B6F">搭檔</text>
    <text class="name" x="660" y="438" text-anchor="middle">楊景惇</text>
  </g>
  <g>
    <rect x="756" y="214" width="168" height="282" rx="18" fill="#FFFFFF" stroke="#1B5E4B" stroke-width="3"/>
    <circle cx="840" cy="255" r="20" fill="#C9A227"/>
    <text x="840" y="261" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">單</text>
    <text class="label" x="840" y="303" text-anchor="middle" fill="#1B5E4B">女子單打三</text>
    <line x1="784" y1="326" x2="896" y2="326" stroke="#C9A227" stroke-width="3"/>
