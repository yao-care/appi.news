    <circle cx="300" cy="255" r="20" fill="#2E8B6F"/>
    <text x="300" y="261" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">雙</text>
    <text class="label" x="300" y="303" text-anchor="middle" fill="#1B5E4B">女子雙打一</text>
    <line x1="244" y1="326" x2="356" y2="326" stroke="#C9A227" stroke-width="3"/>
    <text class="name" x="300" y="370" text-anchor="middle">林芷昀</text>
    <text x="300" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#2E8B6F">搭檔</text>
    <text class="name" x="300" y="438" text-anchor="middle">許尹鏸</text>
  </g>
  <g>
    <rect x="396" y="214" width="168" height="282" rx="18" fill="#FFFFFF" stroke="#1B5E4B" stroke-width="3"/>
    <circle cx="480" cy="255" r="20" fill="#C9A227"/>
    <text x="480" y="261" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">單</text>
    <text class="label" x="480" y="303" text-anchor="middle" fill="#1B5E4B">女子單打二</text>
    <line x1="424" y1="326" x2="536" y2="326" stroke="#C9A227" stroke-width="3"/>
    <text class="name" x="480" y="382" text-anchor="middle">林湘緹</text>
    <text class="sub" x="480" y="454" text-anchor="middle">單打選手</text>
  </g>
  <g>
