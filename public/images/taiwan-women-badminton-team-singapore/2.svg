  <circle cx="445" cy="535" r="4" fill="#C9A227"/>
  <text x="480" y="541" text-anchor="middle" font-size="15" font-weight="700" fill="#1B5E4B">三個單打點・兩個雙打點</text>
  <circle cx="515" cy="535" r="4" fill="#C9A227"/>
<text x="940.8" y="585" text-anchor="end" font-family="sans-serif" font-size="17" fill="#6B7B77" fill-opacity="0.45" font-weight="600">appi.news</text></svg>